<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Mumble Aperture — an isolated black-and-gold UI experiment">
  <title>Mumble Aperture — UI Experiment</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="focus">
  <svg class="svg-defs" aria-hidden="true">
    <defs>

        <path d="M3 11.2 12 4l9 7.2v8.3a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5Z"/><path d="M9 21v-6h6v6"/>

      <symbol id="i-layers" viewBox="0 0 24 24">
        <path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/>
      </symbol>
      <symbol id="i-chart" viewBox="0 0 24 24">
        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
      </symbol>
      <symbol id="i-mic" viewBox="0 0 24 24">
        <rect x="8" y="2.5" width="8" height="13" rx="4"/><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5V22M8.5 22h7"/>
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H11a2 2 0 0 1 2 2v17a3 3 0 0 0-3-3H4Z"/><path d="M20 4.5A2.5 2.5 0 0 0 17.5 2H13v19a3 3 0 0 1 3-3h4Z"/>
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/>
      </symbol>
      <symbol id="i-command" viewBox="0 0 24 24">
        <path d="M9 7.5H6.5a3.5 3.5 0 1 1 3.5-3.5v16a3.5 3.5 0 1 1-3.5-3.5H17.5A3.5 3.5 0 1 1 14 20V4a3.5 3.5 0 1 1 3.5 3.5Z"/>
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
      </symbol>
      <symbol id="i-shield" viewBox="0 0 24 24">
        <path d="M12 3 20 6v5c0 5.2-3.1 8.4-8 10-4.9-1.6-8-4.8-8-10V6Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/>
      </symbol>
      <symbol id="i-spark" viewBox="0 0 24 24">
        <path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/>
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
      </symbol>
      <symbol id="i-star" viewBox="0 0 24 24">
        <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/>
      </symbol>
      <symbol id="i-mail" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m4 12.5 5 5L20 6.5"/>
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="m8 5 11 7-11 7Z"/>
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <path d="M8 5v14M16 5v14"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 4v16M4 12h16"/>
      </symbol>
      <symbol id="i-filter" viewBox="0 0 24 24">
        <path d="M3 5h18M6 12h12M10 19h4"/>
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 16V3M7 8l5-5 5 5M4 14v6h16v-6"/>
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 3v13M7 11l5 5 5-5M4 20h16"/>
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m9 5 7 7-7 7"/>
      </symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24">
        <path d="M6 3h12v18l-6-4-6 4Z"/>
      </symbol>
      <symbol id="i-volume" viewBox="0 0 24 24">
        <path d="M4 10v4h4l5 4V6l-5 4Z"/><path d="M17 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11"/>
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/>
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24">
        <rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 1v5M15 1v5M9 18v5M15 18v5M1 9h5M1 15h5M18 9h5M18 15h5M9 9h6v6H9Z"/>
      </symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24">
        <path d="M7 19h11a4 4 0 0 0 .7-7.9A7 7 0 0 0 5.2 9.5 4.8 4.8 0 0 0 7 19Z"/>
      </symbol>
      <symbol id="i-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m5 5 14 14M19 5 5 19"/>
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M4 12h16M14 6l6 6-6 6"/>
      </symbol>
      <symbol id="i-headphones" viewBox="0 0 24 24">
        <path d="M4 14v-2a8 8 0 0 1 16 0v2"/><path d="M4 14h3v7H5a1 1 0 0 1-1-1ZM20 14h-3v7h2a1 1 0 0 0 1-1Z"/>
      </symbol>
      <symbol id="i-wave" viewBox="0 0 24 24">
        <path d="M3 12h2l2-6 4 12 3-10 3 8 2-4h2"/>
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16M9 3h6l1 4H8ZM7 7l1 14h8l1-14M10 11v6M14 11v6"/>
      </symbol>
    </defs>
  </svg>

  <div class="atmosphere" aria-hidden="true">
    <div class="fine-grid"></div>
    <div class="horizon-line"></div>
    <div class="grain"></div>
  </div>

  <div class="app-shell" id="app-shell">
    <header class="instrument-header">
      <div class="masthead">
        <button class="identity" data-view-target="focus" aria-label="Go to Home">
          <span class="identity-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="identity-copy"><strong>MUMBLE</strong><small>APERTURE / 02</small></span>
        </button>
        <div class="masthead-actions">
          <span class="local-state"><i></i>LOCAL</span>
          <button class="command-key" id="command-trigger" aria-label="Open command menu">
            <svg><use href="#i-command"></use></svg><span>COMMAND</span><kbd>CTRL K</kbd>
          </button>
        </div>
      </div>

      <div class="aperture-navigation">
        <nav class="nav-wing nav-wing-left" aria-label="Primary navigation">
          <button class="nav-node is-active" data-view-target="focus">
            <span class="node-number">01</span><span class="node-label">HOME</span><svg><use href="#i-home"></use></svg>
          </button>
          <button class="nav-node" data-view-target="deck">
            <span class="node-number">02</span><span class="node-label">DECK</span><svg><use href="#i-layers"></use></svg>
          </button>
          <button class="nav-node" data-view-target="signals">
            <span class="node-number">03</span><span class="node-label">STATS</span><svg><use href="#i-chart"></use></svg>
          </button>
        </nav>

        <button class="voice-core" id="voice-core" type="button" aria-label="Start dictation" aria-pressed="false">
          <span class="echo echo-one"></span>
          <span class="echo echo-two"></span>
          <span class="core-ticks"></span>
          <span class="core-glint"></span>
          <span class="core-disc">
            <span class="core-index">VOICE / 01</span>
            <span class="core-status" id="core-status" aria-live="polite">READY TO LISTEN</span>
            <span class="core-wave" id="core-wave" aria-hidden="true"></span>
            <span class="core-caption" id="core-caption">CTRL + WIN</span>
            <svg class="core-mic"><use href="#i-mic"></use></svg>
          </span>
          <span class="orbit-label orbit-label-a">LOCAL</span>
          <span class="orbit-label orbit-label-b">SMALL.EN</span>
          <span class="orbit-label orbit-label-c">CLEAN TEXT</span>
        </button>

        <nav class="nav-wing nav-wing-right" aria-label="Primary navigation continued">
          <button class="nav-node" data-view-target="sessions">
            <svg><use href="#i-mic"></use></svg><span class="node-label">MEETINGS</span><span class="node-number">04</span>
          </button>
          <button class="nav-node" data-view-target="reader">
            <svg><use href="#i-book"></use></svg><span class="node-label">READER</span><span class="node-number">05</span>
          </button>
          <button class="nav-node" data-view-target="controls">
            <svg><use href="#i-settings"></use></svg><span class="node-label">SETTINGS</span><span class="node-number">06</span>
          </button>
        </nav>
      </div>

      <div class="instrument-state" aria-hidden="true">
        <span>ROUTE / ON-DEVICE</span>
        <i></i>
        <span>MIC / SYSTEM DEFAULT</span>
        <i></i>
        <span>OUTPUT / ACTIVE APP</span>
      </div>
    </header>

    <main class="workspace" id="workspace">
      <section class="view" id="view"></section>
    </main>

    <footer class="utility-footer">
      <span><i class="status-pip"></i> AUDIO NEVER LEAVES THIS DEVICE</span>
      <span>EXPERIMENTAL INTERFACE / MOCK DATA</span>
      <button type="button" data-action="show-shortcuts">SHORTCUTS <kbd>?</kbd></button>
    </footer>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="command-palette" id="command-palette" role="dialog" aria-modal="true" aria-labelledby="command-title" hidden>
    <div class="command-heading">
      <span class="command-symbol"><svg><use href="#i-command"></use></svg></span>
      <div><small id="command-title">APERTURE COMMAND</small><input id="command-input" autocomplete="off" aria-label="Search commands" placeholder="Move anywhere or run an action…"></div>
      <kbd>ESC</kbd>
    </div>
    <div class="command-results" id="command-results" role="listbox" aria-label="Command results"></div>
    <div class="command-foot"><span>↑↓ NAVIGATE</span><span>ENTER SELECT</span><span>ALL ACTIONS ARE MOCKED</span></div>
  </section>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
