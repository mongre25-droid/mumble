      &lt;div class=&quot;plain-item&quot;&gt;&lt;strong&gt;Good&lt;/strong&gt;&lt;span&gt;“Voice-command regression: 8 passed on Windows 11 with isolated data. Full offline suite not run. Microphone wake path manually verified; macOS/Linux unverified.”&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;plain-item&quot;&gt;&lt;strong&gt;Misleading&lt;/strong&gt;&lt;span&gt;“Everything works,” “fully tested,” “production-ready,” or “cross-platform” when only a source inspection or one mocked path ran.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;cicd&quot; data-family=&quot;delivery&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;11&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Delivery · CI, CD, and environments&lt;/span&gt;&lt;h2&gt;Automation should repeat a proven process on a clean machine.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;strong&gt;CI · Continuous integration&lt;/strong&gt;&lt;div class=&quot;spectrum&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;p&gt;Every proposed change is automatically built and tested. CI answers: “Did this exact commit pass the checks we know how to run?” It does not publish to users.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;strong&gt;CD · Continuous delivery/deployment&lt;/strong&gt;&lt;div class=&quot;spectrum&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;p&gt;Automation prepares a releasable candidate (delivery) or publishes it automatically (deployment). Mumble should begin with owner-approved delivery.&lt;/p&gt;&lt;/article&gt;
    &lt;/div&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Workflow&lt;/strong&gt;&lt;span&gt;The automation file defining triggers, jobs, permissions, and steps.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Trigger / event&lt;/strong&gt;&lt;span&gt;What starts it: push, pull request, tag, schedule, or manual action.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Job&lt;/strong&gt;&lt;span&gt;A group of steps running on one machine or runner.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Runner&lt;/strong&gt;&lt;span&gt;The machine that executes the job, hosted by GitHub or by you.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Step&lt;/strong&gt;&lt;span&gt;One command or reusable Action inside a job.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Matrix&lt;/strong&gt;&lt;span&gt;Run variations across operating systems, language versions, or configurations.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Cache&lt;/strong&gt;&lt;span&gt;Saved dependencies that speed future runs. It is not authoritative build output.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Artifact&lt;/strong&gt;&lt;span&gt;A retained result such as test JSON, logs, a site bundle, or release archive.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Gate&lt;/strong&gt;&lt;span&gt;A condition that must pass before merge, promotion, or release.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Environment&lt;/strong&gt;&lt;span&gt;A named target such as development, release candidate, or production with its own controls and secrets.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;Mumble already has a serious CI definition&lt;/h3&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Job&lt;/th&gt;&lt;th&gt;What it currently intends to prove&lt;/th&gt;&lt;th&gt;What it cannot prove alone&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Job&quot;&gt;&lt;strong&gt;Windows offline&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Proves&quot;&gt;Dependencies install; Python compiles; fatal lint, Bandit, dependency audit, and offline tests run; test results upload.&lt;/td&gt;&lt;td data-label=&quot;Limit&quot;&gt;Real microphone, global hotkeys, tray, paste target, installer, signing, and user-device diversity.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Job&quot;&gt;&lt;strong&gt;macOS offline&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Proves&quot;&gt;Dependencies, script syntax, archive build/checksum, compile/lint/security/audit, and tests on a hosted macOS image.&lt;/td&gt;&lt;td data-label=&quot;Limit&quot;&gt;Native permissions, audio devices, Accessibility, signing/notarization, and broad hardware versions.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Job&quot;&gt;&lt;strong&gt;Linux and packaging&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Proves&quot;&gt;System dependencies, shell validation, wheel resolution, deterministic archive, tests, install/uninstall lifecycle, and desktop files.&lt;/td&gt;&lt;td data-label=&quot;Limit&quot;&gt;Real X11/Wayland desktops, hotkeys, audio devices, distribution variety, and user configuration.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Job&quot;&gt;&lt;strong&gt;Website&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Proves&quot;&gt;Clean npm install, dependency audit, Astro build, and Astro checks.&lt;/td&gt;&lt;td data-label=&quot;Limit&quot;&gt;Live hosting configuration, domain, analytics, browser breadth, and production download integrity.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;p&gt;The file cannot run on GitHub from this checkout until the repository is connected and pushed. Once it runs, the first objective is not “green at any cost.” It is to classify every failure honestly:&lt;/p&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Product failure&lt;/strong&gt;&lt;span&gt;The code or behaviour is wrong.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Test failure&lt;/strong&gt;&lt;span&gt;The intended behaviour is right but the assertion, fixture, isolation, or expectation is wrong.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Environment failure&lt;/strong&gt;&lt;span&gt;The runner lacks a required dependency, service, permission, or platform capability.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Workflow failure&lt;/strong&gt;&lt;span&gt;The CI definition, path, trigger, permission, cache, or artifact handling is wrong.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Flake&lt;/strong&gt;&lt;span&gt;Timing, concurrency, ordering, or external instability makes the same code alternate between pass and fail.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Expected unsupported path&lt;/strong&gt;&lt;span&gt;The test is asking a hosted environment to prove a native/hardware claim it cannot actually establish.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;Practical Mumble environments&lt;/h3&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Environment&lt;/th&gt;&lt;th&gt;Meaning&lt;/th&gt;&lt;th&gt;Data and secrets&lt;/th&gt;&lt;th&gt;Exit condition&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Environment&quot;&gt;&lt;strong&gt;Development&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Short-lived branch or worktree running source locally.&lt;/td&gt;&lt;td data-label=&quot;Data&quot;&gt;Isolated test data; no production credentials by default.&lt;/td&gt;&lt;td data-label=&quot;Exit&quot;&gt;Focused outcome works and relevant local checks pass.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Environment&quot;&gt;&lt;strong&gt;CI&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Fresh hosted machine with declared dependencies.&lt;/td&gt;&lt;td data-label=&quot;Data&quot;&gt;Synthetic fixtures; minimal token permissions.&lt;/td&gt;&lt;td data-label=&quot;Exit&quot;&gt;Deterministic automated gates pass.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Environment&quot;&gt;&lt;strong&gt;Release candidate&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Exact built artifact installed into a clean VM or user profile.&lt;/td&gt;&lt;td data-label=&quot;Data&quot;&gt;Dedicated test account/data; signing handled through protected process.&lt;/td&gt;&lt;td data-label=&quot;Exit&quot;&gt;Install, smoke, update, rollback, and uninstall evidence.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Environment&quot;&gt;&lt;strong&gt;Production&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Signed published desktop release or live website.&lt;/td&gt;&lt;td data-label=&quot;Data&quot;&gt;Real users; strict secrets and telemetry/privacy controls.&lt;/td&gt;&lt;td data-label=&quot;Exit&quot;&gt;Owner approved the exact verified artifact and monitoring/rollback exist.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout warning&quot;&gt;
      &lt;strong&gt;CI is not truth beyond its coverage.&lt;/strong&gt;
      &lt;span&gt;A hosted green check cannot establish that a physical microphone, global hotkey, tray menu, Accessibility permission, Wayland compositor, code signature, updater channel, or clean user machine behaves correctly. Keep native manual gates.&lt;/span&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;release&quot; data-family=&quot;delivery&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;12&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Delivery · releases and production&lt;/span&gt;&lt;h2&gt;A source change is not a release, and a release is not just a ZIP.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Version&lt;/strong&gt;&lt;span&gt;A human-readable identifier for a software state, such as &lt;code&gt;1.0.0&lt;/code&gt;.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Semantic versioning&lt;/strong&gt;&lt;span&gt;A convention: major for incompatible change, minor for compatible feature, patch for compatible fix.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Release candidate (RC)&lt;/strong&gt;&lt;span&gt;A specific build believed ready for final qualification, such as &lt;code&gt;1.0.0-rc.1&lt;/code&gt;.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Build artifact&lt;/strong&gt;&lt;span&gt;The exact installer, executable, archive, site bundle, manifest, or checksum generated from a commit.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Checksum / hash&lt;/strong&gt;&lt;span&gt;A fingerprint used to detect corruption or unexpected modification.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Manifest&lt;/strong&gt;&lt;span&gt;A machine-readable inventory of files, versions, checksums, dependencies, or release metadata.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Code signing&lt;/strong&gt;&lt;span&gt;A cryptographic signature proving which key signed an artifact and that its bytes have not changed.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Notarization&lt;/strong&gt;&lt;span&gt;Apple&#x27;s additional automated review/ticket process for distributed macOS software.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Release notes&lt;/strong&gt;&lt;span&gt;User-facing description of what changed, known limitations, and upgrade information.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Rollback&lt;/strong&gt;&lt;span&gt;A controlled return to a known-good version or state after a bad release.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Observability&lt;/strong&gt;&lt;span&gt;Logs, metrics, traces, crash evidence, and user reports that reveal how software behaves after release.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Incident&lt;/strong&gt;&lt;span&gt;A production failure requiring coordination, mitigation, recovery, and learning.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;The Mumble release pipeline&lt;/h3&gt;
    &lt;div class=&quot;journey&quot; role=&quot;img&quot; aria-label=&quot;Mumble release pipeline selects a green commit, tags a candidate, builds on clean machines, signs and checks artifacts, installs and tests the download, approves release, publishes, and monitors rollback readiness&quot;&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Green commit&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;reviewed main&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;RC tag&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;exact source&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Clean build&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;per platform&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Sign + hash&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;trust chain&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Install + QA&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;downloaded artifact&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Approve&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;owner gate&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Publish&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;GitHub Release&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Promote feed&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;signed manifest&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Observe&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;crashes + reports&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Rollback&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;known-good path&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Patch&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;new version&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Learn&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;improve harness&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;Release gates&lt;/h3&gt;
    &lt;div class=&quot;stage-grid&quot;&gt;
      &lt;div class=&quot;stage&quot;&gt;&lt;strong&gt;Product correctness&lt;/strong&gt;&lt;span&gt;Core dictation loop, recovery, route-specific privacy, no false success, and critical workflows verified.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stage&quot;&gt;&lt;strong&gt;Build integrity&lt;/strong&gt;&lt;span&gt;Clean environment, declared dependencies, deterministic packaging, checksums, manifests, and licence inventory.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stage&quot;&gt;&lt;strong&gt;Trust chain&lt;/strong&gt;&lt;span&gt;Owner-controlled signing keys, signed artifacts/manifests, no unsigned downgrade, and preserved previous versions.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stage&quot;&gt;&lt;strong&gt;Platform qualification&lt;/strong&gt;&lt;span&gt;Native Windows/macOS/Linux evidence supports only the platforms and versions claimed.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stage&quot;&gt;&lt;strong&gt;Documentation truth&lt;/strong&gt;&lt;span&gt;User guide, onboarding, settings, privacy copy, release notes, and actual artifact agree.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stage&quot;&gt;&lt;strong&gt;Recovery&lt;/strong&gt;&lt;span&gt;Rollback, uninstall, data preservation, backup, and support path tested before promotion.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout warning&quot;&gt;
      &lt;strong&gt;Do not silently rebuild and replace an existing version tag.&lt;/strong&gt;
      &lt;span&gt;A version must identify immutable source and artifacts. If a release is bad, withdraw it or publish a new patch from a known-good commit. Preserve the forensic trail.&lt;/span&gt;
    &lt;/div&gt;
    &lt;h3&gt;Secrets and signing keys&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;Never commit private signing keys, API keys, tokens, passwords, or account recovery codes.&lt;/li&gt;
      &lt;li&gt;Keep local development secrets in environment variables or ignored local configuration.&lt;/li&gt;
      &lt;li&gt;Use GitHub Secrets only for workflows that truly need them, with minimum token permissions.&lt;/li&gt;
      &lt;li&gt;Prefer protected, manually approved release jobs before any production secret is exposed.&lt;/li&gt;
      &lt;li&gt;Keep offline, secure recovery copies of signing keys and GitHub account recovery material.&lt;/li&gt;
      &lt;li&gt;The public verification key may be embedded in the application; the private signing key must remain private.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;daily-loop&quot; data-family=&quot;workflow&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;13&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Workflow · everyday operation&lt;/span&gt;&lt;h2&gt;The exact loop to use every time you work with Codex.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;viz-controls&quot; role=&quot;radiogroup&quot; aria-label=&quot;Choose task size&quot;&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; id=&quot;mcg-size-tiny&quot; type=&quot;radio&quot; name=&quot;mcg-size&quot; value=&quot;tiny&quot; checked&gt;&lt;span class=&quot;form-check-label&quot;&gt;Tiny fix&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; id=&quot;mcg-size-normal&quot; type=&quot;radio&quot; name=&quot;mcg-size&quot; value=&quot;normal&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;Normal feature&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; id=&quot;mcg-size-large&quot; type=&quot;radio&quot; name=&quot;mcg-size&quot; value=&quot;large&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;Multi-day or risky&lt;/span&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;answer&quot; id=&quot;mcg-size-answer&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;stack&quot;&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;1 · Choose one outcome&lt;/strong&gt;&lt;span&gt;Use an Issue or concise task statement. Write why it matters, acceptance criteria, non-goals, and boundaries.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;2 · Ground in current truth&lt;/strong&gt;&lt;span&gt;Ask Codex to read root instructions, current status, relevant architecture, reachable code, related tests, current branch, and dirty diff. Old reports are leads.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;3 · Investigate before editing&lt;/strong&gt;&lt;span&gt;For a bug, reproduce it. For a feature, trace the end-to-end responsibility path. For an architecture question, map current dependencies and constraints.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;4 · Plan proportionally&lt;/strong&gt;&lt;span&gt;Use Plan mode when scope, ownership, or trade-offs are unclear. Agree on the smallest coherent slice and the verification plan.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;5 · Isolate the work&lt;/strong&gt;&lt;span&gt;Start from a known base and use a short-lived &lt;code&gt;codex/&amp;lt;outcome&amp;gt;&lt;/code&gt; branch. Use a worktree when parallel tasks need separate files.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;6 · Implement one vertical slice&lt;/strong&gt;&lt;span&gt;Make the smallest change that completes the user path. Preserve unrelated changes. Do not add speculative abstraction or duplicate platform implementations.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;7 · Verify in layers&lt;/strong&gt;&lt;span&gt;Focused regression → local offline gate → relevant lint/security/dependency checks → manual/native journey → clean CI.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;8 · Review the diff&lt;/strong&gt;&lt;span&gt;Use a separate read-only review pass for correctness, data loss, privacy/security, concurrency, platform regressions, false success, missing tests, and unrelated scope.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;9 · Update only triggered documentation&lt;/strong&gt;&lt;span&gt;Architecture if stable system truth changed; status if evidence/readiness/risk changed; log for a meaningful completed outcome; release notes only when shipped.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;10 · Commit a coherent checkpoint&lt;/strong&gt;&lt;span&gt;Stage only the intended files. Use an outcome-based message. Never let “commit everything” substitute for understanding.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;11 · Push and open a draft PR&lt;/strong&gt;&lt;span&gt;Include goal, scope, non-goals, risk, screenshots, exact checks, manual gaps, documentation impact, and linked Issue.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;12 · Integrate or leave an honest state&lt;/strong&gt;&lt;span&gt;Merge only after review and green applicable gates. Otherwise update the Issue/plan with what remains and why. Never call unfinished work shipped.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;Completion checklist&lt;/h3&gt;
    &lt;div class=&quot;stack&quot; id=&quot;mcg-completion-list&quot;&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;The observable user outcome is demonstrated against the acceptance criteria.&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;Focused and broader applicable checks ran, with exact results recorded.&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;The complete diff was reviewed for regressions, deletion, and unrelated scope.&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;Privacy, secrets, data loss, concurrency, dependencies, licences, and platform impact were considered where relevant.&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;Canonical docs changed only where their owned truth changed.&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;The work is on the correct branch and saved as coherent commits or explicitly left unfinished.&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;Manual, native, release, or production checks still needed are stated honestly.&lt;/span&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;completion-progress&quot; id=&quot;mcg-completion-progress&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;h3&gt;What the final Codex response should contain&lt;/h3&gt;
    &lt;pre&gt;&lt;code&gt;Outcome: what now works or what was learned
Changed: the small set of paths and responsibilities affected
Verification: exact checks, environments, and results
Review: important findings resolved or still open
Documentation: which canonical truth changed, if any
Remaining risk: unverified platform, hardware, provider, or release paths
Next gate: the one action required before merge or release&lt;/code&gt;&lt;/pre&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;worked-example&quot; data-family=&quot;workflow&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;14&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Workflow · worked example&lt;/span&gt;&lt;h2&gt;Voice-command history, from mixed files to a shipped change.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p&gt;This example uses paths visible in Mumble&#x27;s current dirty tree. It is a method demonstration, not a conclusion that all listed files belong to one feature; the real diff must decide that.&lt;/p&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Stage&lt;/th&gt;&lt;th&gt;What you write or do&lt;/th&gt;&lt;th&gt;Evidence left behind&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Stage&quot;&gt;&lt;strong&gt;Issue&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Action&quot;&gt;“Voice commands should be recognized without accidental triggers, execute the agreed actions, and preserve prompt history across restart.” Add non-goals such as cloud-sync redesign.&lt;/td&gt;&lt;td data-label=&quot;Evidence&quot;&gt;Issue with observable acceptance criteria and scope.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Stage&quot;&gt;&lt;strong&gt;Preserve&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Action&quot;&gt;Back up the folder and place the mixed dirty state on a named recovery branch without discarding any path.&lt;/td&gt;&lt;td data-label=&quot;Evidence&quot;&gt;Named branch and unchanged backup.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Stage&quot;&gt;&lt;strong&gt;Classify&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Action&quot;&gt;Inspect &lt;code&gt;voice_commands.py&lt;/code&gt;, &lt;code&gt;test_voice_commands.py&lt;/code&gt;, &lt;code&gt;prompt_history.py&lt;/code&gt;, deletion of &lt;code&gt;prompt_memory.py&lt;/code&gt;, and every caller. Separate unrelated settings, cloud, UI, and experimental changes.&lt;/td&gt;&lt;td data-label=&quot;Evidence&quot;&gt;File-to-outcome map and clean branch boundary.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Stage&quot;&gt;&lt;strong&gt;Trace&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Action&quot;&gt;Follow microphone/input → recognition → command parser → controller/manager → action/history → persistence → UI feedback and error handling.&lt;/td&gt;&lt;td data-label=&quot;Evidence&quot;&gt;Plan naming ownership and boundary risks.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Stage&quot;&gt;&lt;strong&gt;Tests first&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Action&quot;&gt;Cover valid commands, near misses, disabled state, no-match text, history migration, restart persistence, error preservation, and thread-safe dispatch as applicable.&lt;/td&gt;&lt;td data-label=&quot;Evidence&quot;&gt;Regression that fails for missing behaviour and passes after fix.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Stage&quot;&gt;&lt;strong&gt;Implement&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Action&quot;&gt;Make the smallest coherent production-path change. Avoid cloud sync or broad UI refactors unless the trace proves they are necessary.&lt;/td&gt;&lt;td data-label=&quot;Evidence&quot;&gt;Focused diff with no unrelated files.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Stage&quot;&gt;&lt;strong&gt;Verify&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Action&quot;&gt;Run the voice-command pattern, relevant regression groups, syntax/compile checks, and manual microphone/hotkey journey with isolated data.&lt;/td&gt;&lt;td data-label=&quot;Evidence&quot;&gt;Commands, counts, environment, failures, and manual result.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Stage&quot;&gt;&lt;strong&gt;Review&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Action&quot;&gt;Check accidental triggers, false success, persistence compatibility, deleted-file migration, privacy, thread ownership, platform path, and data recovery.&lt;/td&gt;&lt;td data-label=&quot;Evidence&quot;&gt;Review findings resolved or explicitly open.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Stage&quot;&gt;&lt;strong&gt;PR + CI&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Action&quot;&gt;Commit only the coherent slice, push, open a draft PR, link the Issue, and let clean-machine checks run.&lt;/td&gt;&lt;td data-label=&quot;Evidence&quot;&gt;PR diff, checks, discussion, and final commit.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Stage&quot;&gt;&lt;strong&gt;Release&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Action&quot;&gt;After merge, include it in a tagged candidate, test the installed artifact, then publish the new signed version.&lt;/td&gt;&lt;td data-label=&quot;Evidence&quot;&gt;Tag, artifacts, checksums/signatures, QA, and release notes.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout success&quot;&gt;
      &lt;strong&gt;The lasting question is not “Did Codex say complete?”&lt;/strong&gt;
      &lt;span&gt;It is: can someone later identify the problem, exact proposed change, checks, review, merge, release artifact, and recovery path without relying on your memory or the old chat?&lt;/span&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;extensions&quot; data-family=&quot;extensions&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;15&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Extensions · skills, tools, and automation&lt;/span&gt;&lt;h2&gt;Add capabilities only after the manual workflow is understood.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Capability&lt;/th&gt;&lt;th&gt;Plain-English purpose&lt;/th&gt;&lt;th&gt;Use it when&lt;/th&gt;&lt;th&gt;Do not use it for&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Capability&quot;&gt;&lt;strong&gt;Script / test&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Purpose&quot;&gt;Deterministic machinery with objective input/output.&lt;/td&gt;&lt;td data-label=&quot;When&quot;&gt;The same check should run the same way every time.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Judgment-heavy investigation.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Capability&quot;&gt;&lt;strong&gt;Skill&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Purpose&quot;&gt;A reusable agent procedure with instructions, references, and optional scripts.&lt;/td&gt;&lt;td data-label=&quot;When&quot;&gt;A multi-step workflow has succeeded repeatedly and its trigger/outputs are stable.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Static project facts, one-off tasks, or vague “be better” guidance.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Capability&quot;&gt;&lt;strong&gt;Plugin&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Purpose&quot;&gt;An installable distribution bundle for skills plus optional apps, MCP, hooks, and assets.&lt;/td&gt;&lt;td data-label=&quot;When&quot;&gt;A stable capability should be installed by other people or repositories.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Early local experimentation.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Capability&quot;&gt;&lt;strong&gt;MCP / connector&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Purpose&quot;&gt;A live bridge to external tools, private data, or actions.&lt;/td&gt;&lt;td data-label=&quot;When&quot;&gt;Codex needs GitHub, Linear, Figma, browser, Slack, shared docs, or an internal service.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Local files Codex can already read.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Capability&quot;&gt;&lt;strong&gt;Hook&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Purpose&quot;&gt;A script that runs automatically around Codex lifecycle events.&lt;/td&gt;&lt;td data-label=&quot;When&quot;&gt;A trusted deterministic rule must be enforced every time.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;A first attempt at memory, logging, or a changing workflow.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Capability&quot;&gt;&lt;strong&gt;Scheduled task&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Purpose&quot;&gt;Recurring unattended work.&lt;/td&gt;&lt;td data-label=&quot;When&quot;&gt;The prompt and manual process are already tested, narrow, and safe.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Unbounded feature work or anything requiring frequent judgment.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Capability&quot;&gt;&lt;strong&gt;Subagent&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Purpose&quot;&gt;A temporary parallel specialist within one task.&lt;/td&gt;&lt;td data-label=&quot;When&quot;&gt;Independent research, review, platform inspection, or testing can run concurrently.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Permanent project memory or overlapping edits without coordination.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Capability&quot;&gt;&lt;strong&gt;Custom agent&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Purpose&quot;&gt;A reusable specialist role with model, reasoning, tools, sandbox, and skill configuration.&lt;/td&gt;&lt;td data-label=&quot;When&quot;&gt;A recurring role—reviewer, security auditor, researcher—needs stable settings.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Replacing clear task instructions.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;h3&gt;How a skill works&lt;/h3&gt;
    &lt;p&gt;Codex initially sees the skill&#x27;s name, description, and path. It loads the full &lt;code&gt;SKILL.md&lt;/code&gt; only when you explicitly invoke it with &lt;code&gt;$skill-name&lt;/code&gt; or the task matches the description. This progressive disclosure saves context.&lt;/p&gt;
    &lt;pre&gt;&lt;code&gt;.agents\skills\mumble-change-verification\
├─ SKILL.md                 required instructions and trigger description
├─ references\              optional test matrix and platform notes
├─ scripts\                 optional deterministic helpers
└─ assets\                  optional reusable templates or files

---
name: mumble-change-verification
description: Verify an implemented Mumble change. Use after coding to map
  changed areas to focused tests, run safe offline gates, inspect the diff,
  and report exact evidence. Do not publish or deploy.
---

1. Read root AGENTS.md and the relevant architecture/status sections.
2. Inspect the diff and identify affected user paths and boundaries.
3. Run the smallest relevant regression first.
4. Expand to the normal offline gate according to risk.
5. Review failures; never hide, delete, or relabel a failure as a pass.
6. Return commands, results, manual gaps, and remaining risk.&lt;/code&gt;&lt;/pre&gt;
    &lt;h3&gt;Where skills live&lt;/h3&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;Repository skill&lt;/strong&gt;&lt;span&gt;&lt;code&gt;.agents/skills/&amp;lt;name&amp;gt;/SKILL.md&lt;/code&gt;&lt;/span&gt;&lt;small&gt;Checked into Mumble and available to work in this repository.&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;Personal skill&lt;/strong&gt;&lt;span&gt;&lt;code&gt;$HOME/.agents/skills/&amp;lt;name&amp;gt;/SKILL.md&lt;/code&gt;&lt;/span&gt;&lt;small&gt;Available across your repositories for a personal workflow.&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;Skills Mumble may earn&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;&lt;strong&gt;&lt;code&gt;mumble-change-verification&lt;/code&gt;&lt;/strong&gt; — select the right tests and return consistent evidence.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;&lt;code&gt;mumble-doc-truth-audit&lt;/code&gt;&lt;/strong&gt; — compare canonical docs with reachable code and current test evidence.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;&lt;code&gt;mumble-privacy-egress-audit&lt;/code&gt;&lt;/strong&gt; — trace audio, text, documents, keys, telemetry, sync, and providers across boundaries.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;&lt;code&gt;mumble-release-check&lt;/code&gt;&lt;/strong&gt; — prepare and verify a candidate without publishing it.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;&lt;code&gt;mumble-port-parity&lt;/code&gt;&lt;/strong&gt; — compare shared behaviour, platform adapters, and native evidence.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;&lt;code&gt;mumble-ui-smoke&lt;/code&gt;&lt;/strong&gt; — drive stable UI journeys after a repeatable launch/test environment exists.&lt;/li&gt;
    &lt;/ol&gt;
    &lt;div class=&quot;callout&quot;&gt;
      &lt;strong&gt;Begin with no custom skills.&lt;/strong&gt;
      &lt;span&gt;First stabilize root instructions, canonical docs, branches, tests, review, PRs, and CI. When the same judgment-heavy procedure has succeeded at least several times, capture one focused skill. If a deterministic script or test is enough, prefer that.&lt;/span&gt;
    &lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Plugin versus skill&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A skill defines the workflow. A plugin distributes one or more stable skills and can bundle connectors, MCP configuration, hooks, assets, or UI metadata. Author the local skill first; package a plugin only when sharing or bundling is the actual requirement.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;MCP versus skill&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A skill says &lt;em&gt;how&lt;/em&gt; to perform work. MCP gives Codex an external capability or live source it can use. A GitHub-review skill might use a GitHub connector; they solve different layers.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Hook versus CI&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A Codex hook runs around agent lifecycle events. CI runs repository checks on clean automation runners. Hooks can improve or block agent behaviour locally; CI remains the shared, tool-independent gate attached to commits and PRs.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Automation versus a long-running task&lt;/summary&gt;&lt;div&gt;&lt;p&gt;An automation wakes on a schedule or recurring condition. A long-running task continues one outcome. Test a scheduled workflow manually first, grant the narrowest permissions, use worktree isolation for local Git projects, and review early runs.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;prompts&quot; data-family=&quot;extensions&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;16&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Extensions · prompt library&lt;/span&gt;&lt;h2&gt;Useful prompts describe the work contract in ordinary language.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p&gt;You do not need theatrical prompt engineering. State the outcome, relevant context, boundaries, acceptance criteria, verification, and desired output. Let Codex inspect the repository instead of pasting the whole project into chat.&lt;/p&gt;
    &lt;div class=&quot;copy-area&quot;&gt;
      &lt;div class=&quot;copy-head&quot;&gt;&lt;h3&gt;Investigate without changing code&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-copy=&quot;mcg-prompt-investigate&quot;&gt;Copy&lt;/button&gt;&lt;/div&gt;
      &lt;pre id=&quot;mcg-prompt-investigate&quot;&gt;&lt;code&gt;Diagnose [observable problem] without modifying files.

Start from root AGENTS.md, current status, relevant architecture, the current branch/diff, reachable code, and related tests. Reproduce the problem if safe. Trace the complete path through UI/input, bridge, controller, engine/store, OS/network boundary, persistence, and error handling. Distinguish confirmed facts, evidence, inference, and unknowns.

Return: concise cause, affected paths, reproduction evidence, why current tests did or did not catch it, the smallest credible fix, verification plan, and decisions that genuinely require me.&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;div class=&quot;copy-area&quot;&gt;
      &lt;div class=&quot;copy-head&quot;&gt;&lt;h3&gt;Plan a feature&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-copy=&quot;mcg-prompt-feature-plan&quot;&gt;Copy&lt;/button&gt;&lt;/div&gt;
      &lt;pre id=&quot;mcg-prompt-feature-plan&quot;&gt;&lt;code&gt;Goal: [observable user outcome].

Context: Inspect root AGENTS.md, current status, relevant architecture, reachable production code, related tests, and the current diff. The user problem is [problem and why it matters].

Boundaries: Preserve unrelated changes. Do not add production dependencies, change privacy claims, publish, deploy, rewrite Git history, or widen scope without explicit approval. Non-goals: [items].

Done when: [acceptance criteria], the focused regression exists and passes, broader applicable checks run, the complete diff is reviewed, documentation truth is current, and manual/unverified risks are stated.

Work in Plan mode. Return the smallest end-to-end slice, affected responsibilities, test plan, risks, migration/compatibility impact, and any consequential choice I must make.&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;div class=&quot;copy-area&quot;&gt;
      &lt;div class=&quot;copy-head&quot;&gt;&lt;h3&gt;Fix a bug&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-copy=&quot;mcg-prompt-bug&quot;&gt;Copy&lt;/button&gt;&lt;/div&gt;
      &lt;pre id=&quot;mcg-prompt-bug&quot;&gt;&lt;code&gt;Fix [bug] on the current task branch.

First reproduce it and identify the owning path. Add the smallest behavioural regression that fails for the real bug. Then make the smallest coherent production-path change that turns it green. Preserve unrelated work and avoid cosmetic refactors.

Verify the focused test, the relevant offline gate, and the real user journey where safe. Review the complete diff for false success, data loss, concurrency, privacy/security, platform regressions, migration compatibility, and missing coverage.

Do not commit, push, merge, publish, deploy, add dependencies, or change secrets without explicit authorization. Return outcome, cause, changed paths, exact verification, manual gaps, documentation impact, and remaining risk.&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;div class=&quot;copy-area&quot;&gt;
      &lt;div class=&quot;copy-head&quot;&gt;&lt;h3&gt;Implement an accepted plan&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-copy=&quot;mcg-prompt-implement&quot;&gt;Copy&lt;/button&gt;&lt;/div&gt;
      &lt;pre id=&quot;mcg-prompt-implement&quot;&gt;&lt;code&gt;Implement the accepted plan on the current task branch. Continue autonomously through safe, reversible, in-scope work. Preserve unrelated changes. Complete one coherent vertical slice, add or update focused behavioural tests, run the agreed checks, exercise the user path where safe, inspect the full diff, and perform a separate read-only self-review.

If new evidence invalidates the plan, stop only for a consequential decision; otherwise adapt narrowly and explain why. Do not commit, push, merge, publish, deploy, add production dependencies, change secrets, or rewrite history unless explicitly authorized.

Finish with: outcome, changed responsibilities and files, exact test/check results, review findings, documentation triggers, manual gates still needed, and remaining risk.&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;div class=&quot;copy-area&quot;&gt;
      &lt;div class=&quot;copy-head&quot;&gt;&lt;h3&gt;Refactor without changing behaviour&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-copy=&quot;mcg-prompt-refactor&quot;&gt;Copy&lt;/button&gt;&lt;/div&gt;
      &lt;pre id=&quot;mcg-prompt-refactor&quot;&gt;&lt;code&gt;Refactor [area] to achieve [structural objective] without intentionally changing user-visible behaviour.

Before editing, identify the current contracts, callers, tests, data formats, thread/process ownership, platform variants, and compatibility obligations. Define the invariants that must remain true. Add characterization tests where behaviour is not already protected.

Make incremental steps, keep each step reviewable, and avoid unrelated cleanup. Run focused and broad applicable checks after each risky boundary. Review the final diff for accidental behaviour change, public API/data migration impact, duplicated paths, and deleted recovery logic.

Return the before/after responsibility map, exact evidence, remaining coupling, and any behaviour that could not be proven unchanged.&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;div class=&quot;copy-area&quot;&gt;
      &lt;div class=&quot;copy-head&quot;&gt;&lt;h3&gt;Documentation truth audit&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-copy=&quot;mcg-prompt-docs&quot;&gt;Copy&lt;/button&gt;&lt;/div&gt;
      &lt;pre id=&quot;mcg-prompt-docs&quot;&gt;&lt;code&gt;Audit root AGENTS.md, the canonical product/README, architecture/Handbook, current Status, Logs/Changelog, active plans, CI definition, reachable code, and current test evidence for [area]. Do not modify files.

List contradictions, duplicated facts, stale claims, missing evidence, ambiguous ownership, and links pointing to superseded documents. Distinguish implemented, verified, merged, built, and shipped. Treat old reports and Git history as evidence, not current feature truth.

Recommend the smallest correction set and name the one canonical owner for each fact.&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;div class=&quot;copy-area&quot;&gt;
      &lt;div class=&quot;copy-head&quot;&gt;&lt;h3&gt;Read-only review&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-copy=&quot;mcg-prompt-review&quot;&gt;Copy&lt;/button&gt;&lt;/div&gt;
      &lt;pre id=&quot;mcg-prompt-review&quot;&gt;&lt;code&gt;Review the current branch/diff read-only against [Issue or acceptance criteria]. Prioritize correctness, false success, data loss, privacy/security, secrets, concurrency, compatibility, platform regressions, dependency/licence risk, recovery paths, and missing behavioural tests. Verify that unrelated work is not included.

Run safe targeted checks where useful. Report actionable findings by severity with exact file locations and evidence. Then list coverage gaps, manual gates, and what would close each uncertainty. Do not modify files.&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;div class=&quot;copy-area&quot;&gt;
      &lt;div class=&quot;copy-head&quot;&gt;&lt;h3&gt;Release-readiness audit&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-copy=&quot;mcg-prompt-release&quot;&gt;Copy&lt;/button&gt;&lt;/div&gt;
      &lt;pre id=&quot;mcg-prompt-release&quot;&gt;&lt;code&gt;Audit [version/commit] for release readiness without publishing or deploying.

Verify source revision, version consistency, clean dependency installation, CI status, tests, packaging, checksums/manifests, licences, code signing/notarization status, clean install/run/update/rollback/uninstall, platform qualification, privacy/user-guide truth, release notes, preserved prior artifacts, and production recovery plan.

Separate passed gates, failed gates, unverified gates, and gates impossible in this environment. Do not treat source presence as release evidence. Return a go/no-go recommendation with exact evidence and the smallest actions required to reach go.&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;div class=&quot;copy-area&quot;&gt;
      &lt;div class=&quot;copy-head&quot;&gt;&lt;h3&gt;Resume the same outcome in a new task&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-copy=&quot;mcg-prompt-resume&quot;&gt;Copy&lt;/button&gt;&lt;/div&gt;
      &lt;pre id=&quot;mcg-prompt-resume&quot;&gt;&lt;code&gt;Continue [named outcome]. Re-establish state from root AGENTS.md, the linked Issue or active plan, current branch and diff, relevant code/tests/docs, and the latest commit/PR evidence. Do not assume the previous chat is available or authoritative.

Summarize what is complete, what is verified, what is merely implemented, what remains, and the next smallest safe step. Preserve unrelated work and do not widen scope. Continue autonomously through safe in-scope work; finish with exact verification and remaining risk.&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;div class=&quot;copy-area&quot;&gt;
      &lt;div class=&quot;copy-head&quot;&gt;&lt;h3&gt;Decide whether to create a skill&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-copy=&quot;mcg-prompt-skill&quot;&gt;Copy&lt;/button&gt;&lt;/div&gt;
      &lt;pre id=&quot;mcg-prompt-skill&quot;&gt;&lt;code&gt;Audit at least [three] successful instances of [workflow]. Identify the stable trigger, inputs, ordered steps, decision points, deterministic checks, outputs, failure modes, required references/tools, and parts that still vary.

Recommend whether the workflow belongs in AGENTS.md, a focused document/runbook, a deterministic script/test, or one Codex skill. If a skill is justified, draft its narrow description and SKILL.md. Do not add a plugin, MCP connection, hook, or automation unless the evidence specifically requires that layer.&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;p class=&quot;muted&quot; id=&quot;mcg-copy-status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;safety&quot; data-family=&quot;extensions&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;17&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Extensions · safety and trade-offs&lt;/span&gt;&lt;h2&gt;Autonomy is earned by making failure cheap, visible, and reversible.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;h3&gt;Permission and control vocabulary&lt;/h3&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Sandbox&lt;/strong&gt;&lt;span&gt;A boundary restricting which files, network destinations, commands, or apps an agent can access.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Approval policy&lt;/strong&gt;&lt;span&gt;When Codex must ask before attempting an action outside its ordinary allowed scope.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Least privilege&lt;/strong&gt;&lt;span&gt;Grant only the access required for the current job, for only as long as required.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;External side effect&lt;/strong&gt;&lt;span&gt;An action affecting people or systems outside the local working copy: push, publish, deploy, message, purchase, delete remote data.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Destructive action&lt;/strong&gt;&lt;span&gt;An operation that can irreversibly discard data or rewrite history.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Reversible action&lt;/strong&gt;&lt;span&gt;An operation with a clear, tested path back to the prior state.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;Common failure patterns&lt;/h3&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;The mega-instruction file&lt;/strong&gt;&lt;span&gt;It crowds out relevant code, makes every sentence look equally important, rots quickly, and is hard to verify. Use a short map plus focused docs.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;The immortal status page&lt;/strong&gt;&lt;span&gt;Completed tasks and old notes never leave, so present truth becomes archaeology. Keep a strict snapshot schema.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;Documentation as proof&lt;/strong&gt;&lt;span&gt;An agent-written “done” claim is not evidence. Require tests, runtime checks, diff review, clean CI, and honest gaps.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;Duplicated truth&lt;/strong&gt;&lt;span&gt;Privacy, shortcuts, architecture, readiness, and feature lists copied across files inevitably diverge. Give each fact one canonical owner.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;Ritual for every task&lt;/strong&gt;&lt;span&gt;Huge plans, reports, and logs for a typo waste time and encourage checkbox theatre. Scale the process to risk.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;Chat as memory&lt;/strong&gt;&lt;span&gt;Threads grow noisy and may compact. Durable state belongs in issues, plans, code, tests, Git, PRs, and focused docs.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;One giant commit&lt;/strong&gt;&lt;span&gt;Many features and fixes become impossible to review, revert, or explain independently.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;Editing main forever&lt;/strong&gt;&lt;span&gt;Every experiment shares one fragile workspace, so unfinished changes contaminate the next task.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;Auto-release too early&lt;/strong&gt;&lt;span&gt;Automation publishes broken process faster. Prove signing, candidate QA, and rollback before production deployment.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;AI reviews AI without independent evidence&lt;/strong&gt;&lt;span&gt;Multiple agents can repeat the same mistaken assumption. Use different review prompts plus deterministic tests and human product judgment.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;Tests that inspect source text&lt;/strong&gt;&lt;span&gt;They can pass while the feature is unreachable. Prefer production-path behavioural tests.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;Green by deletion&lt;/strong&gt;&lt;span&gt;Disabling a flaky or failing check hides risk. Fix, quarantine visibly with an Issue, or narrow an impossible environment claim.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;Reasonable engineering disagreements&lt;/h3&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Choice&lt;/th&gt;&lt;th&gt;When it can work&lt;/th&gt;&lt;th&gt;Recommendation for Mumble now&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Choice&quot;&gt;Large AGENTS.md&lt;/td&gt;&lt;td data-label=&quot;Can work&quot;&gt;A small, tightly controlled domain with truly universal constraints.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;Keep the root short and route to focused docs; the current knowledge set is already too large and contradictory.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Choice&quot;&gt;Commit directly to main&lt;/td&gt;&lt;td data-label=&quot;Can work&quot;&gt;Tiny solo experiments with excellent discipline and no parallel work.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;Use short-lived branches and PRs for meaningful changes; current mixed main proves the need.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Choice&quot;&gt;A permanent develop branch&lt;/td&gt;&lt;td data-label=&quot;Can work&quot;&gt;Release-train organizations with a defined branching model.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;Do not add one. Keep trusted main, short branches, tags, and release candidates.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Choice&quot;&gt;Very strict blocking gates&lt;/td&gt;&lt;td data-label=&quot;Can work&quot;&gt;Stable deterministic suites and high-cost failure.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;Block on trusted checks; keep flaky or impossible native gates visible and repair them rather than pretending.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Choice&quot;&gt;Skills for everything&lt;/td&gt;&lt;td data-label=&quot;Can work&quot;&gt;A mature platform with stable repeated workflows.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;Start with none. Earn each skill from repeated success.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Choice&quot;&gt;Full autonomous merging&lt;/td&gt;&lt;td data-label=&quot;Can work&quot;&gt;Highly legible repositories with strong tests, review agents, rollback, and cheap correction.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;Keep human approval for merge and release until the harness demonstrates reliability.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;h3&gt;Actions that always deserve extra care&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;Deleting or overwriting uncommitted work.&lt;/li&gt;
      &lt;li&gt;Rewriting Git history, force-pushing, or removing secrets from old commits.&lt;/li&gt;
      &lt;li&gt;Adding dependencies or changing versions across platform ports.&lt;/li&gt;
      &lt;li&gt;Changing schemas, migrations, data paths, encryption, or deletion behaviour.&lt;/li&gt;
      &lt;li&gt;Sending audio, text, documents, keys, telemetry, or user data to a new provider.&lt;/li&gt;
      &lt;li&gt;Publishing a repository, release, website, update manifest, package, or message.&lt;/li&gt;
      &lt;li&gt;Handling signing keys, API keys, OAuth tokens, or recovery codes.&lt;/li&gt;
      &lt;li&gt;Claiming new platform support, privacy guarantees, security, or production readiness.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;adoption&quot; data-family=&quot;reference&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;18&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Reference · adoption plan&lt;/span&gt;&lt;h2&gt;Install the workflow in layers, starting with the current risk.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;h3&gt;The first seven days&lt;/h3&gt;
    &lt;div class=&quot;stack&quot;&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;Day 1 · Rescue and inventory&lt;/strong&gt;&lt;span&gt;Make a separate full-folder backup. Record the current branch and changed paths. Preserve the dirty work on a named recovery branch. Group files by actual outcome without discarding or staging everything.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;Day 2 · Create the automatic entry point&lt;/strong&gt;&lt;span&gt;Add a concise root &lt;code&gt;AGENTS.md&lt;/code&gt; using the starter template. Point temporarily to the existing chosen docs and real test commands. Verify Codex reports the loaded instructions.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;Day 3 · Choose one canonical Core&lt;/strong&gt;&lt;span&gt;Decide Core or New Core. Update entry links, mark the other superseded, correct critical stale claims, and write one source-of-truth map. Do not rewrite every page.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;Day 4 · Audit and connect GitHub&lt;/strong&gt;&lt;span&gt;Review current files and full history for secrets, personal data, models, binaries, signing material, and licence issues. Rotate exposed credentials. Create an empty private repo, connect &lt;code&gt;origin&lt;/code&gt;, and push audited history.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;Day 5 · Make CI observable&lt;/strong&gt;&lt;span&gt;Run the existing Actions workflow. Classify every failure. Save artifacts and Issues for legitimate deferred gaps. Do not disable checks merely to obtain green.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;Day 6 · Complete one small PR cycle&lt;/strong&gt;&lt;span&gt;Issue → acceptance criteria → branch → Codex Plan → focused change → tests → review → draft PR → CI → deliberate merge.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;strong&gt;Day 7 · Improve one weak link&lt;/strong&gt;&lt;span&gt;Review real friction. Clarify one instruction, fix one test isolation problem, simplify one template, or add one missing command. Do not add advanced automation yet.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;The first thirty days&lt;/h3&gt;
    &lt;div class=&quot;stage-grid&quot;&gt;
      &lt;div class=&quot;stage&quot;&gt;&lt;strong&gt;Week 1 · Traceability&lt;/strong&gt;&lt;span&gt;Root instructions, one canonical doc set, safe GitHub remote, one complete PR loop.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stage&quot;&gt;&lt;strong&gt;Week 2 · Reliable integration&lt;/strong&gt;&lt;span&gt;Make fast PR checks deterministic; separate heavier/nightly/native gaps; add PR and Issue templates; use STATUS only for present truth.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stage&quot;&gt;&lt;strong&gt;Week 3 · Candidate discipline&lt;/strong&gt;&lt;span&gt;Create the first tag-based draft RC, build clean artifacts, generate hashes/manifests, install downloaded artifacts, and document rollback without publishing stable.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stage&quot;&gt;&lt;strong&gt;Week 4 · First earned extension&lt;/strong&gt;&lt;span&gt;If one procedure repeated successfully, create a single verification or doc-truth skill. Consider Codex PR review only after ordinary CI is trusted.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;Later maturity ladder&lt;/h3&gt;
    &lt;div class=&quot;ladder&quot;&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Branch rules and required checks.&lt;/strong&gt; Add when check names and reliability are stable and your GitHub plan supports the required controls.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Dependabot and security automation.&lt;/strong&gt; Enable with controlled update cadence, review, and compatibility testing.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Signed release candidates.&lt;/strong&gt; Establish owner-controlled keys, rotation/recovery, and protected release approvals.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Generated HTML documentation.&lt;/strong&gt; Keep Markdown canonical and render polished views from it to prevent dual truth.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Worktree-based parallelism.&lt;/strong&gt; Use when the setup is reproducible and tasks have independent ownership.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Scheduled maintenance.&lt;/strong&gt; Run drift, dependency, or PR monitoring only after the manual workflow is safe and produces actionable output.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Continuous deployment.&lt;/strong&gt; Consider only when candidate verification, signing, approval, observability, and rollback have proven themselves repeatedly.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout success&quot;&gt;
      &lt;strong&gt;The goal is not maximum process.&lt;/strong&gt;
      &lt;span&gt;The goal is the smallest system that makes important mistakes visible before users pay for them, while letting ordinary work move quickly.&lt;/span&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;faq&quot; data-family=&quot;reference&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;19&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Reference · troubleshooting&lt;/span&gt;&lt;h2&gt;What do I do when…?&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details open&gt;&lt;summary&gt;I open a new Codex task and it does not know the old conversation.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;That is expected. Start from the durable Issue/plan, branch, diff, tests, commits/PR, root &lt;code&gt;AGENTS.md&lt;/code&gt;, and focused docs. Use the resume prompt in Chapter 16. If information exists only in the old chat, move the decision or state into the proper durable owner.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Codex says it is done, but I do not understand the code.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Ask for the user path, changed responsibilities, diff walkthrough, test evidence, manual gaps, and rollback. Then run a separate read-only review. “Done” is a claim; the diff and evidence are reviewable facts.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;The working tree already has unrelated changes.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Do not discard, reset, overwrite, or bulk-stage them. Inventory paths, back up the folder, preserve the mixed state on a branch, and isolate only the intended slice. Stop if two outcomes overlap in the same lines and ownership is unclear.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Two documents disagree.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Use the source-of-truth ladder. Check reachable current code and current behavioural evidence. Identify which document canonically owns the fact, correct that owner, and remove or link the duplicate. Record unverified uncertainty instead of choosing the nicer prose.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A test is red.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Classify it: product, test, environment, workflow, or flake. Reproduce locally when possible. Fix the cause or quarantine visibly with an Issue and rationale if a trusted gate cannot run in that environment. Do not delete evidence merely to merge.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;CI is green, but the feature fails manually.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The suite lacks coverage or the environment differs. Preserve the manual reproduction, add the smallest regression that can catch it, fix the real path, and improve the harness. Green CI means only that existing checks passed.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Codex wants to add a dependency.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Ask why existing code or dependencies cannot solve the problem. Review maintenance, version compatibility, transitive packages, vulnerabilities, licence, size, startup/runtime impact, offline behaviour, and all platform requirement sets. Approve explicitly only if the trade-off is worthwhile.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;I want Codex to work without interrupting me.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Put the safe autonomous contract in root &lt;code&gt;AGENTS.md&lt;/code&gt;, use a bounded prompt, provide acceptance criteria and test commands, and isolate the branch/worktree. It should still stop for consequential decisions, new authority, secrets, destructive actions, external side effects, or genuine blockers.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;I have several independent tasks.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Create one task and branch/worktree per outcome. Parallelize read-only research and independent changes, not overlapping edits in one checkout. Keep integration order and shared dependencies explicit.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A Git merge conflict appears.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Do not choose “ours” or “theirs” blindly. Understand both intended changes, inspect surrounding code and tests, resolve the combined behaviour deliberately, and rerun relevant checks. Conflicts are product decisions when both edits matter.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;I accidentally committed a secret.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Revoke or rotate the credential immediately. Then determine where it was exposed and follow a deliberate history-removal plan if required. Updating &lt;code&gt;.gitignore&lt;/code&gt; or deleting the latest file does not make the old secret safe.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;I am not sure whether something needs a skill.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Run it manually several times. If the procedure has a clear trigger, stable steps, recurring judgment, known inputs/outputs, and useful references, consider a skill. If it is deterministic, use a script/test. If it is a universal rule, use &lt;code&gt;AGENTS.md&lt;/code&gt;. If it is one task, keep it in the prompt or Issue.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;I want to release today.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Run the release-readiness audit. If signing, clean install, artifact verification, update/rollback, platform qualification, privacy copy, or recovery is unverified, publish an internal/draft candidate or do not ship. Urgency does not convert missing evidence into evidence.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A release is bad.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Stop promotion, preserve evidence, restore the last known-good update channel or withdraw the asset, communicate affected scope, and publish a new patch from a known-good commit. Do not silently replace bytes under the same tag.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;glossary&quot; data-family=&quot;reference&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;20&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Reference · glossary and evidence&lt;/span&gt;&lt;h2&gt;The terms, source map, and cumulative coverage check.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;h3&gt;Additional glossary&lt;/h3&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;API endpoint&lt;/strong&gt;&lt;span&gt;A specific callable address or operation in an API.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Backward compatibility&lt;/strong&gt;&lt;span&gt;New software continues to accept or work with older data, clients, or behaviour.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Breaking change&lt;/strong&gt;&lt;span&gt;A change requiring callers, users, data, or integrations to adapt.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Cache&lt;/strong&gt;&lt;span&gt;A temporary copy that makes repeated work faster. It must be safe to rebuild.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Cloud&lt;/strong&gt;&lt;span&gt;Computing or storage running on remote provider infrastructure rather than the user&#x27;s device.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Concurrency&lt;/strong&gt;&lt;span&gt;Multiple tasks making progress during overlapping time.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Data migration&lt;/strong&gt;&lt;span&gt;Transforming stored data from an old shape or location into a new one.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Deprecation&lt;/strong&gt;&lt;span&gt;A supported feature marked for future removal, with a transition path.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Feature flag&lt;/strong&gt;&lt;span&gt;A switch controlling whether behaviour is enabled without removing its code.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Idempotent&lt;/strong&gt;&lt;span&gt;Repeating the same operation has no additional unintended effect after the first success.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Interface&lt;/strong&gt;&lt;span&gt;The defined way one component communicates with another.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Latency&lt;/strong&gt;&lt;span&gt;The delay between an action and its result.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Library / framework&lt;/strong&gt;&lt;span&gt;Reusable code. A library is called by your code; a framework often supplies the structure that calls your code.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Local&lt;/strong&gt;&lt;span&gt;Executed or stored on the user&#x27;s device, subject to the exact route and feature.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Log&lt;/strong&gt;&lt;span&gt;A time-ordered record of events useful for debugging and operations.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Metric&lt;/strong&gt;&lt;span&gt;A numeric measurement over time, such as latency, failures, or memory use.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Protocol&lt;/strong&gt;&lt;span&gt;Rules and message formats two systems follow to communicate.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Schema&lt;/strong&gt;&lt;span&gt;The expected structure and constraints of data.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Telemetry&lt;/strong&gt;&lt;span&gt;Operational data sent or collected to understand product behaviour; it requires explicit privacy design.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Trace&lt;/strong&gt;&lt;span&gt;A linked record of one request or operation as it crosses components.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;Cumulative coverage from the earlier guide&lt;/h3&gt;
    &lt;p&gt;This edition deliberately retains every important job of the prior file:&lt;/p&gt;
    &lt;div class=&quot;coverage-list&quot;&gt;
      &lt;div&gt;&lt;span&gt;The original verdict that the four document jobs were useful but the delivery system was wrong.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;The three-layer model: automatic guidance, focused repository knowledge, and executable enforcement.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;The distinction between system/developer instructions, prompt, &lt;code&gt;AGENTS.md&lt;/code&gt;, docs, config, skills, MCP, tests, and Git.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;The recommended repository structure and migration of README, Handbook, Status, and Logs.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;The information-routing tool and strict current-status contract.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;The everyday working loop, proportional process, prompts, and copy-ready root &lt;code&gt;AGENTS.md&lt;/code&gt;.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;The anti-patterns: mega instructions, immortal status, documentation as proof, duplication, ritual, and chat as memory.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;The trade-offs and disagreements around large instruction files, branches, gates, skills, and autonomy.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;The low-risk migration order and research base.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;New additions: coding basics, application anatomy, Git/GitHub from zero, full test vocabulary, CI/CD, releases, signing, rollback, worked example, FAQ, and a thirty-day path.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;How to read the evidence&lt;/h3&gt;
    &lt;div class=&quot;three-col&quot;&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;strong&gt;Official capability&lt;/strong&gt;&lt;div class=&quot;spectrum&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;p&gt;Codex, Git, GitHub, CI/CD, skills, worktrees, and release claims come from official OpenAI, GitHub, and Git documentation.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;strong&gt;Repository observation&lt;/strong&gt;&lt;div class=&quot;spectrum&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;p&gt;Mumble claims come from direct inspection of this checkout on 13 July 2026 and may change with later edits or commits.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;strong&gt;Tailored recommendation&lt;/strong&gt;&lt;div class=&quot;spectrum&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;p&gt;The adoption order is a reasoned solo desktop-app workflow—not a universal law or a guarantee.&lt;/p&gt;&lt;/article&gt;
    &lt;/div&gt;
    &lt;h3&gt;Official OpenAI and Codex sources&lt;/h3&gt;
    &lt;ul&gt;
