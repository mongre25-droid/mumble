&lt;style&gt;
#mumble-complete-guide {
  --foundation: var(--viz-series-1);
  --codex: var(--viz-series-2);
  --workflow: var(--viz-series-3);
  --delivery: var(--viz-series-4);
  --extensions: var(--viz-series-5);
  --reference: var(--viz-series-6);
  display: grid;
  gap: 30px;
  color: var(--foreground);
}

#mumble-complete-guide .hero,
#mumble-complete-guide .chapter,
#mumble-complete-guide .stack,
#mumble-complete-guide .substack {
  display: grid;
  gap: 14px;
  min-width: 0;
}

#mumble-complete-guide .hero {
  position: relative;
}

#mumble-complete-guide .hero.card {
  border: 1px solid color-mix(in srgb, var(--foundation) 24%, var(--border));
  background:
    radial-gradient(circle at 8% 8%, color-mix(in srgb, var(--foundation) 18%, transparent) 0, transparent 34%),
    radial-gradient(circle at 92% 18%, color-mix(in srgb, var(--extensions) 14%, transparent) 0, transparent 38%),
    radial-gradient(circle at 72% 96%, color-mix(in srgb, var(--workflow) 12%, transparent) 0, transparent 40%),
    var(--card);
  box-shadow: 0 20px 54px color-mix(in srgb, var(--foreground) 10%, transparent);
}

#mumble-complete-guide .spectrum {
  height: 6px;
  background: linear-gradient(
    90deg,
    var(--foundation),
    var(--codex),
    var(--workflow),
    var(--delivery),
    var(--extensions),
    var(--reference)
  );
}

#mumble-complete-guide .hero-copy {
  display: grid;
  gap: 10px;
  padding-block: 8px 2px;
}

#mumble-complete-guide .eyebrow,
#mumble-complete-guide .chapter-label,
#mumble-complete-guide .micro-label {
  color: var(--muted-foreground);
  font-family: var(--font-mono);
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

#mumble-complete-guide .hero h1 {
  max-width: 22ch;
}

#mumble-complete-guide .lead {
  max-width: 64ch;
}

#mumble-complete-guide .replacement-note {
  display: grid;
  gap: 4px;
  padding-left: 13px;
  border-left: 4px solid var(--codex);
}

#mumble-complete-guide .reading-progress {
  height: 5px;
  background: var(--muted);
}

#mumble-complete-guide .reading-progress &gt; span {
  display: block;
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, var(--foundation), var(--workflow), var(--extensions));
  transition: width 160ms ease;
}

#mumble-complete-guide .reading-meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

#mumble-complete-guide .chapter {
  --chapter-color: var(--foundation);
  padding-top: 24px;
  border-top: 1px solid var(--border);
}

#mumble-complete-guide .chapter[data-family=&quot;codex&quot;] { --chapter-color: var(--codex); }
#mumble-complete-guide .chapter[data-family=&quot;workflow&quot;] { --chapter-color: var(--workflow); }
#mumble-complete-guide .chapter[data-family=&quot;delivery&quot;] { --chapter-color: var(--delivery); }
#mumble-complete-guide .chapter[data-family=&quot;extensions&quot;] { --chapter-color: var(--extensions); }
#mumble-complete-guide .chapter[data-family=&quot;reference&quot;] { --chapter-color: var(--reference); }

#mumble-complete-guide .chapter-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 12px;
  border-left: 4px solid var(--chapter-color);
  border-radius: var(--radius-lg);
  background: linear-gradient(
    90deg,
    color-mix(in srgb, var(--chapter-color) 13%, transparent),
    color-mix(in srgb, var(--chapter-color) 3%, transparent) 72%,
    transparent
  );
}

#mumble-complete-guide .chapter-number {
  display: grid;
  place-items: center;
  min-width: 38px;
  min-height: 38px;
  color: var(--foreground);
  border-bottom: 4px solid var(--chapter-color);
  background: color-mix(in srgb, var(--chapter-color) 13%, transparent);
  font-family: var(--font-mono);
  font-weight: 500;
}

#mumble-complete-guide .chapter-title {
  display: grid;
  gap: 4px;
}

#mumble-complete-guide .chapter-label {
  color: color-mix(in srgb, var(--chapter-color) 70%, var(--foreground) 30%);
}

#mumble-complete-guide .two-col,
#mumble-complete-guide .three-col,
#mumble-complete-guide .definition-grid,
#mumble-complete-guide .path-grid,
#mumble-complete-guide .stage-grid {
  display: grid;
  gap: 12px 18px;
  min-width: 0;
}

#mumble-complete-guide .two-col,
#mumble-complete-guide .definition-grid,
#mumble-complete-guide .path-grid,
#mumble-complete-guide .stage-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

#mumble-complete-guide .three-col {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

#mumble-complete-guide .plain-item,
#mumble-complete-guide .definition,
#mumble-complete-guide .step,
#mumble-complete-guide .stage,
#mumble-complete-guide .path-card {
  display: grid;
  gap: 5px;
  min-width: 0;
}

#mumble-complete-guide .definition,
#mumble-complete-guide .step,
#mumble-complete-guide .stage,
#mumble-complete-guide .path-card {
  padding-left: 12px;
  border-left: 2px solid var(--chapter-color);
}

#mumble-complete-guide .definition small,
#mumble-complete-guide .path-card small {
  color: var(--muted-foreground);
}

#mumble-complete-guide .callout {
  display: grid;
  gap: 5px;
  padding: 10px 12px;
  border-left: 4px solid var(--chapter-color);
  background: color-mix(in srgb, var(--chapter-color) 8%, transparent);
}

#mumble-complete-guide .callout.warning {
  border-left-color: var(--destructive);
  background: color-mix(in srgb, var(--destructive) 8%, transparent);
}

#mumble-complete-guide .callout.success {
  border-left-color: var(--workflow);
  background: color-mix(in srgb, var(--workflow) 8%, transparent);
}

#mumble-complete-guide .journey {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
  align-items: stretch;
}

#mumble-complete-guide .journey-node {
  display: grid;
  gap: 3px;
  align-content: center;
  min-height: 68px;
  padding: 8px;
  border-bottom: 4px solid var(--node-color, var(--foundation));
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--node-color, var(--foundation)) 9%, transparent);
  text-align: center;
}

#mumble-complete-guide .journey-node:nth-child(6n + 1) { --node-color: var(--foundation); }
#mumble-complete-guide .journey-node:nth-child(6n + 2) { --node-color: var(--codex); }
#mumble-complete-guide .journey-node:nth-child(6n + 3) { --node-color: var(--workflow); }
#mumble-complete-guide .journey-node:nth-child(6n + 4) { --node-color: var(--delivery); }
#mumble-complete-guide .journey-node:nth-child(6n + 5) { --node-color: var(--extensions); }
#mumble-complete-guide .journey-node:nth-child(6n) { --node-color: var(--reference); }

#mumble-complete-guide .table-wrap {
  min-width: 0;
}

#mumble-complete-guide table {
  width: 100%;
  border-collapse: collapse;
}

#mumble-complete-guide th,
#mumble-complete-guide td {
  padding: 9px 7px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}

#mumble-complete-guide th {
  color: var(--muted-foreground);
}

#mumble-complete-guide .ladder {
  display: grid;
  gap: 0;
  counter-reset: ladder;
}

#mumble-complete-guide .ladder &gt; div {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 10px;
  padding-block: 9px;
  border-bottom: 1px solid var(--border);
  counter-increment: ladder;
}

#mumble-complete-guide .ladder &gt; div::before {
  content: counter(ladder);
  color: var(--chapter-color);
  font-family: var(--font-mono);
  font-weight: 500;
}

#mumble-complete-guide details {
  padding-block: 9px;
  border-bottom: 1px solid var(--border);
}

#mumble-complete-guide summary {
  cursor: pointer;
  font-weight: 500;
}

#mumble-complete-guide details &gt; div {
  display: grid;
  gap: 9px;
  padding-top: 9px;
}

#mumble-complete-guide pre {
  max-width: 100%;
  margin: 0;
  padding: 12px;
  border-left: 3px solid var(--chapter-color);
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  font-family: var(--font-mono);
}

#mumble-complete-guide ul,
#mumble-complete-guide ol {
  margin: 0;
  padding-left: 22px;
}

#mumble-complete-guide li + li {
  margin-top: 6px;
}

#mumble-complete-guide .answer,
#mumble-complete-guide .completion-progress {
  display: grid;
  gap: 4px;
  min-height: 3em;
  padding: 10px 12px;
  border-left: 3px solid var(--chapter-color);
  background: color-mix(in srgb, var(--chapter-color) 7%, transparent);
}

#mumble-complete-guide .copy-area {
  display: grid;
  gap: 8px;
}

#mumble-complete-guide .copy-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

#mumble-complete-guide .muted {
  color: var(--muted-foreground);
}

#mumble-complete-guide .legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
}

#mumble-complete-guide .legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

#mumble-complete-guide .legend i {
  width: 10px;
  height: 10px;
  background: var(--legend-color);
}

#mumble-complete-guide .coverage-list {
  display: grid;
  gap: 7px;
}

#mumble-complete-guide .coverage-list &gt; div {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 8px;
}

#mumble-complete-guide .coverage-list &gt; div::before {
  content: &quot;✓&quot;;
  color: var(--workflow);
  font-weight: 500;
}

@media (max-width: 680px) {
  #mumble-complete-guide .journey {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 560px) {
  #mumble-complete-guide .two-col,
  #mumble-complete-guide .three-col,
  #mumble-complete-guide .definition-grid,
  #mumble-complete-guide .path-grid,
  #mumble-complete-guide .stage-grid,
  #mumble-complete-guide .journey {
    grid-template-columns: 1fr;
  }

  #mumble-complete-guide table,
  #mumble-complete-guide thead,
  #mumble-complete-guide tbody,
  #mumble-complete-guide tr,
  #mumble-complete-guide th,
  #mumble-complete-guide td {
    display: block;
  }

  #mumble-complete-guide thead {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  #mumble-complete-guide tr {
    padding-block: 8px;
    border-bottom: 1px solid var(--border);
  }

  #mumble-complete-guide td {
    display: grid;
    grid-template-columns: minmax(90px, 0.34fr) minmax(0, 1fr);
    gap: 8px;
    padding: 4px 0;
    border: 0;
  }

  #mumble-complete-guide td::before {
    content: attr(data-label);
    color: var(--muted-foreground);
    font-weight: 500;
  }
}

@media (prefers-reduced-motion: reduce) {
  #mumble-complete-guide .reading-progress &gt; span {
    transition: none;
  }
}

  &lt;header class=&quot;hero card&quot;&gt;

      &lt;p class=&quot;eyebrow&quot;&gt;Mumble engineering handbook · complete edition · 13 July 2026&lt;/p&gt;
      &lt;h1&gt;From “vibe coding” to shipping software you can trust.&lt;/h1&gt;
      &lt;p class=&quot;lead&quot;&gt;This is the cumulative beginner guide: what code is, how Codex works, where project memory lives, how Git and GitHub protect the work, how tests and CI create evidence, and how an idea becomes a real Mumble release.&lt;/p&gt;

    &lt;/div&gt;
    &lt;div class=&quot;reading-progress&quot; aria-hidden=&quot;true&quot;&gt;&lt;span id=&quot;mcg-progress-bar&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;reading-meta&quot;&gt;&lt;span id=&quot;mcg-current-chapter&quot;&gt;Chapter 01 · Orientation&lt;/span&gt;&lt;span id=&quot;mcg-progress-text&quot;&gt;0% read&lt;/span&gt;&lt;/div&gt;
  &lt;/header&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;orientation&quot; data-family=&quot;foundation&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;01&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Foundations · orientation&lt;/span&gt;&lt;h2&gt;You are not starting from zero—but your workflow is exposed.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p&gt;Mumble is already a substantial software project. The missing part is not “coding ability.” It is a reliable system for deciding what to build, separating one change from another, checking the result, remembering why it changed, and controlling what reaches users.&lt;/p&gt;
    &lt;div class=&quot;three-col&quot;&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;strong&gt;Already present&lt;/strong&gt;&lt;div class=&quot;spectrum&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;p&gt;184 local Git commits, two local branches, a test runner, hundreds of tests, a multi-platform CI workflow file, release tooling, and extensive documentation.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;strong&gt;Not connected&lt;/strong&gt;&lt;div class=&quot;spectrum&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;p&gt;No GitHub remote, no hosted pull requests, no hosted Actions runs from this checkout, no GitHub Releases, no root &lt;code&gt;AGENTS.md&lt;/code&gt;.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;strong&gt;Immediate risk&lt;/strong&gt;&lt;div class=&quot;spectrum&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;p&gt;Roughly 29 changed paths were mixed directly on &lt;code&gt;main&lt;/code&gt;, while two competing documentation systems both claim authority.&lt;/p&gt;&lt;/article&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout warning&quot;&gt;
      &lt;strong&gt;Do not stage everything, publish everything, or “clean up” the working tree yet.&lt;/strong&gt;
      &lt;span&gt;Back up the folder, preserve every current change, classify the work, inspect it for secrets and accidental files, and split it into coherent outcomes. Uncommitted work is the least protected state.&lt;/span&gt;
    &lt;/div&gt;
    &lt;h3&gt;The workflow problem in one picture&lt;/h3&gt;
    &lt;div class=&quot;journey&quot; role=&quot;img&quot; aria-label=&quot;The unsafe loop relies on chat and memory, while the safe loop writes intent, isolates the change, verifies it, reviews it, records it, and releases deliberately&quot;&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Unsafe&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;idea in your head&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Prompt&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;“add feature”&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Edit main&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;mixed changes&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Trust summary&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;no proof&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;New chat&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;context lost&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Repeat&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;debt compounds&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Safe&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;written outcome&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Isolate&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;branch / worktree&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Implement&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;small slice&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Verify&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;tests + behaviour&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Review&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;diff + risk&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Record&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;commit / PR&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;What “done” can mean&lt;/h3&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Implemented&lt;/strong&gt;&lt;span&gt;The code path exists.&lt;/span&gt;&lt;small&gt;It may still be wrong or unreachable.&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Verified&lt;/strong&gt;&lt;span&gt;Relevant evidence passed.&lt;/span&gt;&lt;small&gt;Only the exercised paths are supported.&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Reviewed&lt;/strong&gt;&lt;span&gt;The complete proposed change was inspected.&lt;/span&gt;&lt;small&gt;Review reduces risk; it does not guarantee perfection.&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Merged&lt;/strong&gt;&lt;span&gt;The change is integrated into &lt;code&gt;main&lt;/code&gt;.&lt;/span&gt;&lt;small&gt;It still may not be in a user artifact.&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Built&lt;/strong&gt;&lt;span&gt;Source produced an installable or deployable artifact.&lt;/span&gt;&lt;small&gt;The artifact needs its own verification.&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Shipped&lt;/strong&gt;&lt;span&gt;The verified artifact reached users.&lt;/span&gt;&lt;small&gt;This is the production boundary.&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;coding-basics&quot; data-family=&quot;foundation&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;02&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Foundations · coding vocabulary&lt;/span&gt;&lt;h2&gt;What code actually is—from files to a running product.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p&gt;You do not need a computer-science degree to direct Codex well, but you do need a map of the objects it is changing. These terms are the basic nouns of software work.&lt;/p&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;File&lt;/strong&gt;&lt;span&gt;A named unit of data, such as Python source, HTML, an image, or configuration.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Folder / directory&lt;/strong&gt;&lt;span&gt;A container that groups files. A path identifies where a file lives.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Source code&lt;/strong&gt;&lt;span&gt;Human-readable instructions and definitions that make up the application.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Programming language&lt;/strong&gt;&lt;span&gt;The grammar used to express code. Mumble primarily uses Python, JavaScript, HTML, and CSS.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Runtime&lt;/strong&gt;&lt;span&gt;The software environment that executes code. Python runs Python modules; a browser engine runs JavaScript and renders HTML/CSS.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Entry point&lt;/strong&gt;&lt;span&gt;The place execution starts. It creates or calls the rest of the system.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Module&lt;/strong&gt;&lt;span&gt;A source file or package that owns a focused responsibility and can be imported elsewhere.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Function&lt;/strong&gt;&lt;span&gt;A named unit of behaviour that accepts inputs and may return an output.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Class / object&lt;/strong&gt;&lt;span&gt;A way to group data and behaviour. An object is a live instance of a class.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Variable / state&lt;/strong&gt;&lt;span&gt;A stored value. State is the current set of values that determines what the application believes is happening.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Input / output&lt;/strong&gt;&lt;span&gt;Data entering or leaving a component: audio in, transcript out; button event in, UI update out.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Error / exception&lt;/strong&gt;&lt;span&gt;A condition that interrupts the normal path. Good software handles expected failures honestly and preserves work.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Dependency&lt;/strong&gt;&lt;span&gt;External code your project relies on. It saves work but adds compatibility, security, licence, and maintenance obligations.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Package manager&lt;/strong&gt;&lt;span&gt;A tool that installs dependencies from a declared list. Mumble uses Python requirement files; the website uses npm.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Configuration&lt;/strong&gt;&lt;span&gt;Values that alter behaviour without changing core code: settings, provider selection, feature flags, or paths.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Environment variable&lt;/strong&gt;&lt;span&gt;A value supplied by the operating environment, often used for configuration or secrets.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;From source to running Mumble&lt;/h3&gt;
    &lt;div class=&quot;journey&quot; role=&quot;img&quot; aria-label=&quot;Mumble source and configuration are loaded by runtimes, which create processes and user interfaces, call services and operating-system boundaries, and persist results&quot;&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Source&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;Python + web files&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Runtime&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;Python + browser engine&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Processes&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;controller + window&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Services&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;STT + AI + stores&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;OS / network&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;audio + hotkeys + APIs&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;User result&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;text + history + files&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;
      &lt;strong&gt;A “small” visible feature can cross many layers.&lt;/strong&gt;
      &lt;span&gt;A button may touch HTML, JavaScript, a Python bridge, a controller, an engine, persistent storage, operating-system behaviour, tests, and documentation. This is why the workflow traces the real path before editing.&lt;/span&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;anatomy&quot; data-family=&quot;foundation&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;03&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Foundations · application anatomy&lt;/span&gt;&lt;h2&gt;Frontend, backend, data, APIs, and the operating system.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Term&lt;/th&gt;&lt;th&gt;Plain meaning&lt;/th&gt;&lt;th&gt;Mumble example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;&lt;strong&gt;Frontend / UI&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;What the user sees and interacts with.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;HTML/CSS/JavaScript window, island, settings, buttons, status, history.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;&lt;strong&gt;Backend&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Logic behind the interface: coordination, processing, storage, and external calls.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;Python controller, speech engines, formatting, AI routing, Reader, Meetings, stores.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;&lt;strong&gt;Bridge / IPC&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;A boundary that lets processes or languages communicate.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;The web window calls Python methods; processes exchange authenticated commands.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;&lt;strong&gt;API&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;A defined interface another component can call. It can be local or remote.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;A Python method, provider endpoint, or operating-system service.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;&lt;strong&gt;Database / store&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Persistent data that survives a restart.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;History, settings, modes, meetings, documents, favourites, and local models.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;&lt;strong&gt;Serialization&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Turning live data into a storable/transmittable format such as JSON.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;Saving settings and history records to local files.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;&lt;strong&gt;Process&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;A running program with its own memory.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;The main controller and the separate Web UI host.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;&lt;strong&gt;Thread&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;A concurrent execution path inside a process.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;Tray, audio, background loading, clipboard, update checks, UI dispatch.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;&lt;strong&gt;Race condition&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;A bug where outcome depends on timing between concurrent work.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;Settings or UI state changed by two threads without safe ownership.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Term&quot;&gt;&lt;strong&gt;Platform adapter&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Meaning&quot;&gt;Code isolating Windows, macOS, or Linux differences behind one interface.&lt;/td&gt;&lt;td data-label=&quot;Mumble&quot;&gt;Hotkeys, paste, paths, permissions, tray, packaging, and audio behaviour.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;h3&gt;The user path you should trace&lt;/h3&gt;
    &lt;pre&gt;&lt;code&gt;User intent
→ UI event or hotkey
→ bridge / command boundary
→ controller state transition
→ specialised engine or store
→ operating-system or network boundary
→ durable result
→ UI feedback
→ recovery and error path&lt;/code&gt;&lt;/pre&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;plain-item&quot;&gt;&lt;strong&gt;Local route&lt;/strong&gt;&lt;span&gt;Work stays on the device: local STT, deterministic formatting, local model, and local storage—subject to the exact selected feature.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;plain-item&quot;&gt;&lt;strong&gt;Cloud route&lt;/strong&gt;&lt;span&gt;Some data crosses the device boundary: audio for cloud STT, transcript/context for cloud shaping, document text for some Reader operations, or sync payloads.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout warning&quot;&gt;
      &lt;strong&gt;“Local-first” is not the same claim as “nothing leaves the device.”&lt;/strong&gt;
      &lt;span&gt;Privacy wording must name the selected route, provider, payload, purpose, retention assumptions, and fallback. UI truth is part of the implementation.&lt;/span&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;codex-model&quot; data-family=&quot;codex&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;04&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Codex · mental model&lt;/span&gt;&lt;h2&gt;The model, the agent, the harness, and you.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Model&lt;/strong&gt;&lt;span&gt;The reasoning system that interprets language and produces decisions or text. It can be capable and still be wrong.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Agent&lt;/strong&gt;&lt;span&gt;A model operating in a loop: inspect context, choose an action, use tools, observe results, and continue toward an outcome.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Tool&lt;/strong&gt;&lt;span&gt;A capability the agent can call: read or edit files, run commands, search documentation, use a browser, or interact with an app.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Harness&lt;/strong&gt;&lt;span&gt;The entire surrounding system that makes the agent useful: instructions, tools, permissions, environment, tests, Git, CI, review, and feedback.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Task / thread&lt;/strong&gt;&lt;span&gt;One conversation and its work toward one outcome. Its transcript is temporary working context, not the canonical project record.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Context window&lt;/strong&gt;&lt;span&gt;The finite material the model can consider at once. More context is not automatically better; relevant context matters.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Compaction&lt;/strong&gt;&lt;span&gt;Summarising older conversation so a long task can continue. Detail can be lost, so durable state belongs in the repository.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Memory&lt;/strong&gt;&lt;span&gt;Saved preferences or context that may help future tasks. It is not proof of current code, status, or external facts.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;What a good harness gives Codex&lt;/h3&gt;
    &lt;div class=&quot;journey&quot; role=&quot;img&quot; aria-label=&quot;The Codex harness supplies task intent, repository instructions, focused knowledge, an isolated workspace, deterministic checks, and review feedback&quot;&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Intent&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;goal + boundaries&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Map&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;AGENTS.md&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;focused docs&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Workspace&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;branch / worktree&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Feedback&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;tests + app&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Control&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;review + permissions&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;
      &lt;strong&gt;The human role changes; it does not disappear.&lt;/strong&gt;
      &lt;span&gt;You decide priorities, define observable success, approve consequential product and release choices, and judge the real user experience. Codex can inspect, plan, implement, test, review, document, and iterate. Machines enforce deterministic gates.&lt;/span&gt;
    &lt;/div&gt;
    &lt;h3&gt;Where to use Codex&lt;/h3&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;Desktop app&lt;/strong&gt;&lt;span&gt;Planning, multi-task coordination, visual review, worktrees, browser/computer use, and scheduled follow-up.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;IDE extension&lt;/strong&gt;&lt;span&gt;Editor-attached work when you want code and the task side by side.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;CLI&lt;/strong&gt;&lt;span&gt;Terminal-first local repository work and repeatable commands.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;path-card&quot;&gt;&lt;strong&gt;Cloud / GitHub&lt;/strong&gt;&lt;span&gt;Hosted tasks and PR review after the repository is safely connected and the environment is configured.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;instructions&quot; data-family=&quot;codex&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;05&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Codex · instructions and context&lt;/span&gt;&lt;h2&gt;Why README rules are forgotten—and where they belong.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p&gt;Instructions have scope and precedence. A repository document cannot become a system prompt by calling itself one. Put information on the smallest surface that reliably matches its job.&lt;/p&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Surface&lt;/th&gt;&lt;th&gt;Loaded how?&lt;/th&gt;&lt;th&gt;Best use&lt;/th&gt;&lt;th&gt;Do not use it for&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Surface&quot;&gt;&lt;strong&gt;System / developer instructions&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Loaded&quot;&gt;Provided by the host.&lt;/td&gt;&lt;td data-label=&quot;Use&quot;&gt;Product-wide capabilities, safety, and operating policy.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Mumble facts you can keep in the repository.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Surface&quot;&gt;&lt;strong&gt;Current prompt&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Loaded&quot;&gt;This one task.&lt;/td&gt;&lt;td data-label=&quot;Use&quot;&gt;Outcome, context, boundaries, output, and done criteria.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Rules every future Mumble task needs.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Surface&quot;&gt;&lt;strong&gt;&lt;code&gt;~/.codex/AGENTS.md&lt;/code&gt;&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Loaded&quot;&gt;Automatically, across repositories.&lt;/td&gt;&lt;td data-label=&quot;Use&quot;&gt;Your personal cross-project working preferences.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Mumble architecture or release state.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Surface&quot;&gt;&lt;strong&gt;Root &lt;code&gt;AGENTS.md&lt;/code&gt;&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Loaded&quot;&gt;Automatically for this repository.&lt;/td&gt;&lt;td data-label=&quot;Use&quot;&gt;Short map, commands, boundaries, review rules, definition of done.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Encyclopedia, backlog, and session diary.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Surface&quot;&gt;&lt;strong&gt;Nested &lt;code&gt;AGENTS.md&lt;/code&gt;&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Loaded&quot;&gt;For work under that subtree.&lt;/td&gt;&lt;td data-label=&quot;Use&quot;&gt;Rules genuinely different for website, ports, or experiments.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Copies of root rules.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Surface&quot;&gt;&lt;strong&gt;README / Handbook / Status&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Loaded&quot;&gt;When opened or routed to.&lt;/td&gt;&lt;td data-label=&quot;Use&quot;&gt;Human knowledge and focused project truth.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Assuming every file automatically controls the agent.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Surface&quot;&gt;&lt;strong&gt;&lt;code&gt;config.toml&lt;/code&gt;&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Loaded&quot;&gt;As Codex configuration.&lt;/td&gt;&lt;td data-label=&quot;Use&quot;&gt;Model, reasoning, sandbox, approvals, MCP, feature flags.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Long prose instructions.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Surface&quot;&gt;&lt;strong&gt;Skill&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Loaded&quot;&gt;When explicitly invoked or matched.&lt;/td&gt;&lt;td data-label=&quot;Use&quot;&gt;One reusable task procedure.&lt;/td&gt;&lt;td data-label=&quot;Avoid&quot;&gt;Stable facts or one-off requests.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;
      &lt;strong&gt;Codex discovers &lt;code&gt;AGENTS.md&lt;/code&gt; from broad to specific.&lt;/strong&gt;
      &lt;span&gt;Global guidance loads first, then the repository root, then closer files down to the working directory. Closer guidance takes precedence. The combined project-instruction budget is finite—32 KiB by default—so the root file should be a map, not a 1,000-page manual.&lt;/span&gt;
    &lt;/div&gt;
    &lt;h3&gt;Replace “Undisturbed Autonomous mode” with a truthful contract&lt;/h3&gt;
    &lt;pre&gt;&lt;code&gt;Continue autonomously through safe, reversible, in-scope work.
Do not wait for routine confirmation.
Stop only when completion requires:
- a consequential product choice;
- new authority or an external side effect;
- a secret, destructive action, or permission expansion;
- a conflict with unrelated user changes; or
- user information that cannot be safely inferred.&lt;/code&gt;&lt;/pre&gt;
    &lt;p&gt;That instruction can persist in &lt;code&gt;AGENTS.md&lt;/code&gt;. It does not grant extra filesystem, network, deployment, GitHub, or publishing permission. Those boundaries come from the host, Codex settings, and your explicit authorization.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;knowledge&quot; data-family=&quot;codex&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;06&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Codex · durable knowledge&lt;/span&gt;&lt;h2&gt;One project, one map, one owner for each kind of truth.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p&gt;Your four-document instinct was good. Product intent, architecture, current status, and history are different jobs. The failure came from expecting ordinary HTML files to auto-load and from allowing two document systems to coexist.&lt;/p&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;strong&gt;README / Product charter&lt;/strong&gt;&lt;div class=&quot;spectrum&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;p&gt;What Mumble is, who it serves, installation, product boundaries, honest privacy language, and the human starting point.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;strong&gt;HANDBOOK / Architecture&lt;/strong&gt;&lt;div class=&quot;spectrum&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;p&gt;How the checked-out system works: entry points, flows, modules, state, stores, platform seams, operations, and change playbooks.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;strong&gt;STATUS / Current truth&lt;/strong&gt;&lt;div class=&quot;spectrum&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;p&gt;Verified readiness, active risk, immediate priority, evidence date, and what remains unverified. A snapshot, not a diary.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;strong&gt;LOGS / Outcome index&lt;/strong&gt;&lt;div class=&quot;spectrum&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;p&gt;A concise human index of meaningful completed outcomes. Exact forensic detail belongs in commits and pull requests.&lt;/p&gt;&lt;/article&gt;
    &lt;/div&gt;
    &lt;h3&gt;The additional records real projects need&lt;/h3&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;GitHub Issue / backlog item&lt;/strong&gt;&lt;span&gt;One unfinished bug, feature, investigation, or maintenance outcome with acceptance criteria.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Active plan&lt;/strong&gt;&lt;span&gt;A checked-in execution map for substantial or multi-day work. Delete or move it when complete.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Decision record (ADR)&lt;/strong&gt;&lt;span&gt;A short record of a costly-to-reverse choice, options considered, and consequences.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Pull request&lt;/strong&gt;&lt;span&gt;The exact proposed change, rationale, review discussion, checks, and final integration record.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;CHANGELOG / Release notes&lt;/strong&gt;&lt;span&gt;User-visible changes grouped by shipped version—not every internal edit.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Test and CI evidence&lt;/strong&gt;&lt;span&gt;Machine-readable proof of what was exercised, with failures and gaps kept honest.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;Recommended end state&lt;/h3&gt;
    &lt;pre&gt;&lt;code&gt;C:\Mumble v1\
├─ AGENTS.md                         automatic map + durable working contract
├─ README.md                         human overview, setup, product introduction
├─ Internal\app\                    canonical product source and tests
├─ docs\
│  ├─ PRODUCT.md                    stable promise, users, boundaries, privacy
│  ├─ ARCHITECTURE.md               stable system and data-flow map
│  ├─ CURRENT.md                    verified present snapshot
│  ├─ DEVELOPMENT.md                deeper commands and local setup if needed
│  ├─ plans\active\                substantial current plans only
│  ├─ plans\completed\             retained plans only when useful
│  └─ decisions\                    costly-to-reverse decisions only
├─ CHANGELOG.md                      user-visible shipped changes by version
├─ .agents\skills\                  proven repository workflows, later
└─ .github\                         Issues, PR template, CI, release automation&lt;/code&gt;&lt;/pre&gt;
    &lt;p&gt;You do not need to move everything at once. First create a short root &lt;code&gt;AGENTS.md&lt;/code&gt; that points to the chosen current documents. Then migrate canonical content into diff-friendly Markdown in small steps. The polished HTML can remain a generated view; two editable truths cannot.&lt;/p&gt;
    &lt;div class=&quot;callout warning&quot;&gt;
      &lt;strong&gt;Resolve &lt;code&gt;Development Files/Core&lt;/code&gt; versus &lt;code&gt;Development Files/New Core&lt;/code&gt;.&lt;/strong&gt;
      &lt;span&gt;The old Core calls itself authoritative and is linked by &lt;code&gt;Internal/README.md&lt;/code&gt;. New Core calls itself a replacement candidate. Choose one, update every entry link, and mark the other superseded or archive it. Do not silently maintain both.&lt;/span&gt;
    &lt;/div&gt;
    &lt;h3&gt;Source-of-truth ladder when documents conflict&lt;/h3&gt;
    &lt;div class=&quot;ladder&quot;&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Current reachable code and observed runtime behaviour&lt;/strong&gt;&lt;br&gt;What this checkout actually does—not whether it is safe or ready.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Current behavioural tests and direct verification&lt;/strong&gt;&lt;br&gt;What was exercised, in which environment, and with what result.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Current status snapshot&lt;/strong&gt;&lt;br&gt;Readiness, known risk, priorities, and declared evidence gaps.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Current architecture and product documentation&lt;/strong&gt;&lt;br&gt;Stable intended structure and boundaries, checked against reality.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Issues, plans, decisions, PRs, and commits&lt;/strong&gt;&lt;br&gt;Why work exists, how it changed, and what remains.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Old logs, audits, mock-ups, chats, and archived reports&lt;/strong&gt;&lt;br&gt;Historical evidence and leads—not present product truth.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;A strict STATUS contract&lt;/h3&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;substack&quot;&gt;&lt;strong&gt;STATUS may contain&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Evidence date and tested revision.&lt;/li&gt;&lt;li&gt;Current release posture.&lt;/li&gt;&lt;li&gt;Verified capability health.&lt;/li&gt;&lt;li&gt;Active blockers and immediate priorities.&lt;/li&gt;&lt;li&gt;Explicit unverified platform claims.&lt;/li&gt;&lt;li&gt;Links to the owning issue or active plan.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div class=&quot;substack&quot;&gt;&lt;strong&gt;STATUS must not contain&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Closed task history.&lt;/li&gt;&lt;li&gt;Session transcripts or abandoned ideas.&lt;/li&gt;&lt;li&gt;Every possible future feature.&lt;/li&gt;&lt;li&gt;Architecture copied from the Handbook.&lt;/li&gt;&lt;li&gt;“Done” claims without evidence.&lt;/li&gt;&lt;li&gt;Several conflicting freshness dates.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-controls&quot;&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;mcg-route&quot;&gt;Where should this new information live?&lt;/label&gt;
      &lt;select class=&quot;form-select&quot; id=&quot;mcg-route&quot;&gt;
        &lt;option value=&quot;rule&quot;&gt;A rule most Mumble tasks must follow&lt;/option&gt;
        &lt;option value=&quot;product&quot;&gt;A stable product promise or privacy boundary&lt;/option&gt;
        &lt;option value=&quot;architecture&quot;&gt;How the system works&lt;/option&gt;
        &lt;option value=&quot;status&quot;&gt;A current blocker, risk, or immediate priority&lt;/option&gt;
        &lt;option value=&quot;task&quot;&gt;One unfinished piece of work&lt;/option&gt;
        &lt;option value=&quot;plan&quot;&gt;A substantial multi-day execution sequence&lt;/option&gt;
        &lt;option value=&quot;decision&quot;&gt;Why a costly technical choice was made&lt;/option&gt;
        &lt;option value=&quot;change&quot;&gt;What exact code changed and why&lt;/option&gt;
        &lt;option value=&quot;release&quot;&gt;A user-visible shipped change&lt;/option&gt;
        &lt;option value=&quot;procedure&quot;&gt;A repeated procedure&lt;/option&gt;
      &lt;/select&gt;
    &lt;/div&gt;
    &lt;div class=&quot;answer&quot; id=&quot;mcg-route-answer&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;h3&gt;Copy-ready starter &lt;code&gt;AGENTS.md&lt;/code&gt;&lt;/h3&gt;
    &lt;div class=&quot;copy-area&quot;&gt;
      &lt;div class=&quot;copy-head&quot;&gt;&lt;span class=&quot;micro-label&quot;&gt;Starter contract · adapt paths after choosing Core&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-copy=&quot;mcg-agents-template&quot;&gt;Copy&lt;/button&gt;&lt;/div&gt;
      &lt;pre id=&quot;mcg-agents-template&quot;&gt;&lt;code&gt;# Mumble repository instructions

## Mission
Protect Mumble&#x27;s dependable speech-to-useful-text loop. Prefer truth,
privacy, recovery, and verified behaviour over feature breadth or polish.

## Start here
- Human overview and setup: `README.md` or `Internal/README.md`
- Current release posture: [chosen canonical STATUS path]
- Architecture and change playbooks: [chosen canonical HANDBOOK path]
- Outcome history: [chosen canonical LOGS path]
- Canonical runtime: `Internal/app/`
- CI definition: `.github/workflows/ci.yml`

## Working agreement
- Continue autonomously through safe, reversible, in-scope work.
- Preserve unrelated user changes; never discard or overwrite a dirty tree.
- For meaningful work, trace UI → bridge → controller → engine/store →
  OS/network boundary → persistence and error recovery before editing.
- Make the smallest coherent end-to-end change. Avoid unrelated cleanup.
- Keep local/cloud privacy claims specific to the selected route and payload.
- Ask before adding production dependencies, changing secrets, publishing,
  deploying, rewriting Git history, or performing destructive actions.

## Verification
- Use `Internal/app/run_tests.py` as the normal Mumble test entry point.
- Start with the smallest relevant regression, then expand checks by risk.
- Live-provider tests require explicit opt-in; never use production keys by default.
- Review the complete diff before declaring completion.
- Report exact commands, results, manual gaps, and remaining risk.

## Documentation triggers
- Update architecture only when stable system truth changes.
- Update status only when evidence, readiness, risk, or priority changes.
- Update logs only for a meaningful completed outcome.
- Do not copy the same fact into multiple canonical files.

## Definition of done
The requested outcome is demonstrated; relevant checks pass; the diff is
reviewed; unrelated work is untouched; documentation truth is current; and
unverified items are stated honestly.&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;planning&quot; data-family=&quot;workflow&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;07&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Workflow · specification and planning&lt;/span&gt;&lt;h2&gt;Turn an idea into a task the agent can finish and you can judge.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p&gt;The quality of the task boundary matters more than elaborate prompt wording. Before code, define the observable change and the evidence that will prove it.&lt;/p&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Problem statement&lt;/strong&gt;&lt;span&gt;What is wrong or missing, for whom, and why it matters.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;User story&lt;/strong&gt;&lt;span&gt;A compact perspective: “As a user, I want X so that Y.” Useful, but not enough alone.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Scope&lt;/strong&gt;&lt;span&gt;The responsibilities included in this change.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Non-goals&lt;/strong&gt;&lt;span&gt;Tempting adjacent work explicitly excluded.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Acceptance criteria&lt;/strong&gt;&lt;span&gt;Observable statements that decide whether the outcome works.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Constraint&lt;/strong&gt;&lt;span&gt;A boundary the solution must respect: privacy, compatibility, latency, no new dependency, or platform support.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Assumption&lt;/strong&gt;&lt;span&gt;Something believed but not proven. Important assumptions should be checked before implementation.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Spike / investigation&lt;/strong&gt;&lt;span&gt;Time-bounded learning work whose output is evidence or a decision—not production code by default.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Prototype&lt;/strong&gt;&lt;span&gt;A disposable or limited experiment proving an idea. It is not production-ready merely because it runs.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Refactor&lt;/strong&gt;&lt;span&gt;Change internal structure without intentionally changing user-visible behaviour.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Technical debt&lt;/strong&gt;&lt;span&gt;A shortcut or design cost that makes future change riskier or slower.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Definition of done&lt;/strong&gt;&lt;span&gt;The complete evidence and closeout conditions, beyond the feature behaviour itself.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;A good task contract&lt;/h3&gt;
    &lt;pre&gt;&lt;code&gt;Goal: What observable outcome should exist?
Context: Which current facts, files, reports, or user evidence matter?
Boundaries: What must not change? What actions need explicit approval?
Acceptance criteria: What must a user or test be able to demonstrate?
Verification: Which focused, broad, manual, privacy, and platform checks apply?
Output: What should Codex leave behind—code, tests, plan, review, or report?&lt;/code&gt;&lt;/pre&gt;
    &lt;h3&gt;Choose process by task size&lt;/h3&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Size&lt;/th&gt;&lt;th&gt;Examples&lt;/th&gt;&lt;th&gt;Minimum process&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Size&quot;&gt;&lt;strong&gt;Tiny&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Examples&quot;&gt;Copy correction, obvious one-line defect, low-risk doc fix.&lt;/td&gt;&lt;td data-label=&quot;Process&quot;&gt;Clear outcome → inspect → edit → focused check → diff review. No giant plan or log ritual.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Size&quot;&gt;&lt;strong&gt;Normal&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Examples&quot;&gt;Bounded feature, ordinary bug, focused refactor.&lt;/td&gt;&lt;td data-label=&quot;Process&quot;&gt;Issue → Plan mode → branch → tests → implementation → review → PR → CI.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Size&quot;&gt;&lt;strong&gt;Large / risky&lt;/strong&gt;&lt;/td&gt;&lt;td data-label=&quot;Examples&quot;&gt;Multi-day architecture, data migration, privacy route, release system, platform parity.&lt;/td&gt;&lt;td data-label=&quot;Process&quot;&gt;Issue + active plan + decision points + slices + checkpoint commits + broader review + candidate evidence.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;
      &lt;strong&gt;Plan mode is for ambiguity, not ceremony.&lt;/strong&gt;
      &lt;span&gt;Use it when the correct scope, ownership, architecture, or acceptance criteria are unclear. Once the plan is accepted, implementation should follow it or explain why new evidence requires a change.&lt;/span&gt;
    &lt;/div&gt;
    &lt;h3&gt;One task, one outcome&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;Start a new Codex task for a genuinely different outcome.&lt;/li&gt;
      &lt;li&gt;Resume the existing task when continuing the same outcome.&lt;/li&gt;
      &lt;li&gt;Name tasks by result: “Add voice-command history,” not “Monday coding.”&lt;/li&gt;
      &lt;li&gt;Archive the task after the outcome is merged, abandoned, or handed off durably.&lt;/li&gt;
      &lt;li&gt;Do not use a long chat as the project backlog or architectural memory.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;git&quot; data-family=&quot;workflow&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;08&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Workflow · Git from absolute zero&lt;/span&gt;&lt;h2&gt;Git is the local history and change-isolation system you already have.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p&gt;Git works without GitHub. Mumble already has it. The goal is to use it deliberately so every meaningful change can be understood, compared, recovered, and integrated.&lt;/p&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Repository (repo)&lt;/strong&gt;&lt;span&gt;The project files plus Git&#x27;s history and metadata.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Working tree&lt;/strong&gt;&lt;span&gt;The files exactly as they exist on disk now.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Tracked file&lt;/strong&gt;&lt;span&gt;A file Git knows about from history.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Untracked file&lt;/strong&gt;&lt;span&gt;A new file Git has not been told to include.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Ignored file&lt;/strong&gt;&lt;span&gt;A path intentionally excluded by patterns in &lt;code&gt;.gitignore&lt;/code&gt;.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Diff&lt;/strong&gt;&lt;span&gt;The precise lines added, changed, and removed.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Stage / index&lt;/strong&gt;&lt;span&gt;The selected snapshot content intended for the next commit.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Commit&lt;/strong&gt;&lt;span&gt;A named snapshot of staged content with author, time, parent, and message.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Branch&lt;/strong&gt;&lt;span&gt;A movable name pointing to one line of commits.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;&lt;code&gt;main&lt;/code&gt;&lt;/strong&gt;&lt;span&gt;The default trusted integration branch—not automatically the shipped product.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;HEAD&lt;/strong&gt;&lt;span&gt;Git&#x27;s name for the commit or branch currently checked out.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Merge&lt;/strong&gt;&lt;span&gt;Integrating changes from one branch into another.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Conflict&lt;/strong&gt;&lt;span&gt;Competing edits Git cannot safely combine without a human decision.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Tag&lt;/strong&gt;&lt;span&gt;A durable name for an exact commit, normally used for versions and releases.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Remote&lt;/strong&gt;&lt;span&gt;Another repository location, usually GitHub.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;&lt;code&gt;origin&lt;/code&gt;&lt;/strong&gt;&lt;span&gt;The conventional name for the primary remote.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Clone&lt;/strong&gt;&lt;span&gt;Create a local repository from a remote.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Fetch&lt;/strong&gt;&lt;span&gt;Download remote history without integrating it into your current branch.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Pull&lt;/strong&gt;&lt;span&gt;Fetch and integrate remote changes into the current branch.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Push&lt;/strong&gt;&lt;span&gt;Upload local commits to a remote.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;The safe everyday Git shape&lt;/h3&gt;
    &lt;div class=&quot;journey&quot; role=&quot;img&quot; aria-label=&quot;Git flow starts from updated main, creates a short-lived branch, makes and reviews changes, commits coherent checkpoints, pushes, and merges through a pull request&quot;&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Update main&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;known base&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Create branch&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;isolated outcome&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Edit&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;working tree&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Review diff&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;exact lines&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Commit&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;coherent snapshot&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;journey-node&quot;&gt;&lt;strong&gt;Push / PR&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;remote review&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;What makes a good commit?&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;It represents one coherent durable change.&lt;/li&gt;
      &lt;li&gt;The application is not knowingly left in an incoherent state unless the branch is explicitly work in progress.&lt;/li&gt;
      &lt;li&gt;The message describes the outcome: &lt;code&gt;fix: preserve prompt history during migration&lt;/code&gt;, not &lt;code&gt;stuff&lt;/code&gt; or &lt;code&gt;final fixes&lt;/code&gt;.&lt;/li&gt;
      &lt;li&gt;Unrelated changes are not staged merely because they are present.&lt;/li&gt;
      &lt;li&gt;Relevant tests and review evidence are available in the task or PR.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h3&gt;Safe recovery vocabulary&lt;/h3&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Situation&lt;/th&gt;&lt;th&gt;Safer response&lt;/th&gt;&lt;th&gt;Caution&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Situation&quot;&gt;Uncommitted mistake&lt;/td&gt;&lt;td data-label=&quot;Response&quot;&gt;Inspect the diff and restore only the exact file or hunk you understand.&lt;/td&gt;&lt;td data-label=&quot;Caution&quot;&gt;Restore/reset operations can permanently discard work.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Situation&quot;&gt;Bad feature branch&lt;/td&gt;&lt;td data-label=&quot;Response&quot;&gt;Fix it, compare it, or abandon the branch while preserving other branches.&lt;/td&gt;&lt;td data-label=&quot;Caution&quot;&gt;Check which work exists only on that branch.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Situation&quot;&gt;Bad merged commit&lt;/td&gt;&lt;td data-label=&quot;Response&quot;&gt;Create a revert commit that records the reversal.&lt;/td&gt;&lt;td data-label=&quot;Caution&quot;&gt;Do not rewrite shared history casually.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Situation&quot;&gt;Need parallel work&lt;/td&gt;&lt;td data-label=&quot;Response&quot;&gt;Use a different branch and, if simultaneous local files are needed, a Git worktree.&lt;/td&gt;&lt;td data-label=&quot;Caution&quot;&gt;The same branch cannot be checked out in two worktrees.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;What is rebase?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Rebase replays commits on a different base and changes their identities. It can create a clean history, but it rewrites commits. You do not need it for the beginner workflow. Prefer simple short-lived branches and squash merging until you understand the trade-off.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is stash?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A stash temporarily stores uncommitted changes. It can be convenient, but hidden stashes are easy to forget and mixed work stays mixed. For important current Mumble work, a named branch and deliberate commits are more legible.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;callout warning&quot;&gt;
      &lt;strong&gt;For Mumble&#x27;s current dirty &lt;code&gt;main&lt;/code&gt;, preservation comes before cleanup.&lt;/strong&gt;
      &lt;span&gt;Back up the folder, create a named recovery branch while keeping the work intact, inspect every changed and untracked file, group by outcome, test each coherent slice, and commit deliberately. Do not run destructive Git commands or bulk-stage all paths.&lt;/span&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;github&quot; data-family=&quot;workflow&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;09&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Workflow · GitHub&lt;/span&gt;&lt;h2&gt;GitHub adds a remote control room around Git.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p&gt;Connecting Mumble to GitHub does not replace the files on your computer. It gives pushed commits a remote home and adds coordination, automation, review, security, and release surfaces.&lt;/p&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Private repository&lt;/strong&gt;&lt;span&gt;Only authorized people can view it. Start here while auditing code, history, assets, and secrets.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Public repository&lt;/strong&gt;&lt;span&gt;Anyone can view and copy it. Visibility changes require an explicit licensing, secret, privacy, and asset audit.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Issue&lt;/strong&gt;&lt;span&gt;A durable item for a bug, feature, investigation, or task.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Pull request (PR)&lt;/strong&gt;&lt;span&gt;A proposal to merge one branch into another, with its diff, discussion, commits, and checks.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Draft PR&lt;/strong&gt;&lt;span&gt;A PR opened early for visibility and checks while the work is not yet ready to merge.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Review&lt;/strong&gt;&lt;span&gt;Comments, requested changes, or approval on the proposed diff.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Check / status check&lt;/strong&gt;&lt;span&gt;An automated result attached to a commit or PR.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;GitHub Actions&lt;/strong&gt;&lt;span&gt;GitHub&#x27;s automation service for CI, packaging, releases, and other workflows.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Artifact&lt;/strong&gt;&lt;span&gt;A file produced by a workflow, such as test results, a website build, or release archive.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Ruleset / branch protection&lt;/strong&gt;&lt;span&gt;Repository policy that can require PRs or passing checks before &lt;code&gt;main&lt;/code&gt; changes.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Release&lt;/strong&gt;&lt;span&gt;A tagged, documented software version with downloadable assets.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Secret&lt;/strong&gt;&lt;span&gt;An encrypted credential supplied to authorized workflows—not a value stored in code or logs.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;Why a solo developer still benefits from pull requests&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;The PR&#x27;s Files view is the complete proposed change, separate from every other idea.&lt;/li&gt;
      &lt;li&gt;The description preserves goal, scope, risk, screenshots, and exact verification.&lt;/li&gt;
      &lt;li&gt;The Checks view links the clean-machine result to the exact commit.&lt;/li&gt;
      &lt;li&gt;Review comments preserve questions and decisions better than a chat summary.&lt;/li&gt;
      &lt;li&gt;The PR can close its Issue automatically when merged.&lt;/li&gt;
      &lt;li&gt;Squash merging can turn several work-in-progress commits into one clear &lt;code&gt;main&lt;/code&gt; commit.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h3&gt;Safe first publication of Mumble&lt;/h3&gt;
    &lt;div class=&quot;ladder&quot;&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Make a separate backup.&lt;/strong&gt; Include uncommitted and ignored files you actually need.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Preserve and classify the dirty work.&lt;/strong&gt; Do not upload a mystery state.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Audit the current tree and all Git history.&lt;/strong&gt; Look for API keys, tokens, signing keys, user data, settings, recordings, personal paths, models, oversized binaries, and accidental licences.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Rotate exposed credentials first.&lt;/strong&gt; Removing a secret from the latest file does not invalidate the copy in history or an old clone.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Create an empty private GitHub repository.&lt;/strong&gt; Do not initialize it with conflicting files.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Connect it as &lt;code&gt;origin&lt;/code&gt; and push audited branches.&lt;/strong&gt; Confirm visibility and inspect the remote contents.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Run Actions and keep failures visible.&lt;/strong&gt; Fix the product, test, environment, or workflow cause rather than disabling the gate.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout warning&quot;&gt;
      &lt;strong&gt;GitHub is an off-device copy of pushed, tracked Git data—not a complete backup.&lt;/strong&gt;
      &lt;span&gt;It does not contain uncommitted work, ignored local data, signing/recovery keys, or every piece of Issue/PR/settings metadata in an ordinary clone. Keep a separate mirror backup and secure recovery material.&lt;/span&gt;
    &lt;/div&gt;
    &lt;h3&gt;Recommended ownership split&lt;/h3&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Question&lt;/th&gt;&lt;th&gt;Owner&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Question&quot;&gt;What unfinished work exists?&lt;/td&gt;&lt;td data-label=&quot;Owner&quot;&gt;GitHub Issues or the current active plan.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Question&quot;&gt;What is the current release posture?&lt;/td&gt;&lt;td data-label=&quot;Owner&quot;&gt;STATUS / CURRENT.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Question&quot;&gt;How does the system work?&lt;/td&gt;&lt;td data-label=&quot;Owner&quot;&gt;HANDBOOK / ARCHITECTURE.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Question&quot;&gt;What exact code changed and why?&lt;/td&gt;&lt;td data-label=&quot;Owner&quot;&gt;Commit and pull request.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td data-label=&quot;Question&quot;&gt;What user-visible change shipped?&lt;/td&gt;&lt;td data-label=&quot;Owner&quot;&gt;CHANGELOG and GitHub Release notes.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;chapter&quot; id=&quot;testing&quot; data-family=&quot;delivery&quot;&gt;
    &lt;div class=&quot;chapter-head&quot;&gt;&lt;div class=&quot;chapter-number&quot;&gt;10&lt;/div&gt;&lt;div class=&quot;chapter-title&quot;&gt;&lt;span class=&quot;chapter-label&quot;&gt;Delivery · testing and evidence&lt;/span&gt;&lt;h2&gt;Generated code is a hypothesis. Verification turns it into evidence.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p&gt;Testing is not one button and “all green” is never universal proof. Each type of check answers a different question. A trustworthy closeout states exactly what ran, where it ran, what passed, what failed, and what remains untested.&lt;/p&gt;
    &lt;div class=&quot;definition-grid&quot;&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Unit test&lt;/strong&gt;&lt;span&gt;Checks one small function or class in isolation.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Integration test&lt;/strong&gt;&lt;span&gt;Checks that several real components work together.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;End-to-end (E2E) test&lt;/strong&gt;&lt;span&gt;Exercises a complete user journey through the real boundaries available to the test.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Regression test&lt;/strong&gt;&lt;span&gt;Fails for a known bug before the fix and prevents it from returning.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Contract test&lt;/strong&gt;&lt;span&gt;Checks that two components agree on inputs, outputs, errors, and compatibility.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Smoke test&lt;/strong&gt;&lt;span&gt;A fast “does the essential thing start and basically work?” check.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Manual QA&lt;/strong&gt;&lt;span&gt;A human exercises behaviour that is difficult or misleading to automate.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Fixture / mock&lt;/strong&gt;&lt;span&gt;Controlled test data or a substitute for an external component.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Lint&lt;/strong&gt;&lt;span&gt;Static checks for suspicious or invalid code patterns.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Formatter&lt;/strong&gt;&lt;span&gt;Automatically applies a consistent code style.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Type check&lt;/strong&gt;&lt;span&gt;Checks whether declared data shapes and uses are consistent without running the program.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Static security analysis&lt;/strong&gt;&lt;span&gt;Scans code for classes of risky patterns without executing them.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Dependency audit&lt;/strong&gt;&lt;span&gt;Checks declared third-party packages for known vulnerabilities or policy issues.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Code coverage&lt;/strong&gt;&lt;span&gt;Measures which code a test executed. High coverage does not prove strong assertions or correct behaviour.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Flaky test&lt;/strong&gt;&lt;span&gt;A test that sometimes passes and sometimes fails without a relevant code change.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;definition&quot;&gt;&lt;strong&gt;Test environment&lt;/strong&gt;&lt;span&gt;The OS, dependencies, data, permissions, network, hardware, and settings under which evidence was collected.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;The verification ladder&lt;/h3&gt;
    &lt;div class=&quot;ladder&quot;&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Inspect the real path.&lt;/strong&gt; Confirm entry points, ownership, state, persistence, failures, and platform/cloud boundaries.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Write or identify the focused regression.&lt;/strong&gt; It should fail for the missing behaviour or bug, not only inspect source text.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Run the smallest relevant check.&lt;/strong&gt; Fast feedback localizes failure.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Run the normal offline gate.&lt;/strong&gt; Catch interactions outside the focused test.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Review the complete diff.&lt;/strong&gt; Look for accidental deletion, false success, duplicated logic, secrets, and unrelated edits.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Exercise the real user journey.&lt;/strong&gt; UI, microphone, hotkeys, permissions, tray, paste, devices, installers, and network paths need manual or native evidence.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;&lt;strong&gt;Let CI repeat checks in clean environments.&lt;/strong&gt; “Works on my machine” is not enough.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;h3&gt;Mumble&#x27;s intended local test entry&lt;/h3&gt;
    &lt;pre&gt;&lt;code&gt;Internal/app/run_tests.py

--list       inspect the offline set without executing it
--pattern    select the smallest relevant group
--json       write machine-readable results
--timeout    bound hung tests
--live       permit explicit live-provider testing when separately authorized&lt;/code&gt;&lt;/pre&gt;
    &lt;div class=&quot;callout warning&quot;&gt;
      &lt;strong&gt;Never test against production keys or user data by default.&lt;/strong&gt;
      &lt;span&gt;Use isolated test-data directories, offline mode, controlled fixtures, and explicit live opt-in. A test that silently contacts a provider or writes the real application store is a harness defect.&lt;/span&gt;
    &lt;/div&gt;
    &lt;h3&gt;Evidence language&lt;/h3&gt;
    &lt;div class=&quot;two-col&quot;&gt;
