      &lt;li&gt;&lt;a href=&quot;https://learn.chatgpt.com/guides/best-practices&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Codex best practices&lt;/a&gt; — task context, planning, durable guidance, configuration, testing, review, skills, and automation.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://learn.chatgpt.com/docs/agent-configuration/agents-md&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Custom instructions with AGENTS.md&lt;/a&gt; — discovery, scope, precedence, verification, and instruction-size limit.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://learn.chatgpt.com/docs/build-skills&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Build skills&lt;/a&gt; — structure, progressive disclosure, invocation, locations, and plugin distribution.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://learn.chatgpt.com/docs/config-file/config-basic&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Config basics&lt;/a&gt; — user and project configuration.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://learn.chatgpt.com/docs/extend/mcp&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Model Context Protocol&lt;/a&gt; — external tools and context.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://learn.chatgpt.com/docs/hooks&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Codex hooks&lt;/a&gt; — lifecycle events, trust, and enforcement.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://learn.chatgpt.com/docs/automations&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Scheduled tasks&lt;/a&gt; — recurring work, permissions, local projects, and worktrees.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://learn.chatgpt.com/docs/environments/git-worktrees&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Git worktrees&lt;/a&gt; — isolated parallel work and handoff.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://learn.chatgpt.com/docs/code-review&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Codex code review&lt;/a&gt; — review of working changes, commits, and branches.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://learn.chatgpt.com/docs/third-party/github&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Codex in GitHub&lt;/a&gt; — optional PR review after cloud setup.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://developers.openai.com/cookbook/articles/codex_exec_plans&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Codex execution plans&lt;/a&gt; — durable planning for substantial work.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://openai.com/index/harness-engineering/&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;OpenAI harness engineering&lt;/a&gt; — maps, agent-legible environments, tests, constraints, review loops, and continuous cleanup.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h3&gt;Official Git and GitHub sources&lt;/h3&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;mumble-complete-guide&#x27;);
  if (!root) return;

  const jump = document.getElementById(&#x27;mcg-jump&#x27;);
  jump.addEventListener(&#x27;change&#x27;, () =&gt; {
    const target = document.getElementById(jump.value);
    if (target) target.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
  });

  const routes = {
    rule: [&#x27;Root AGENTS.md&#x27;, &#x27;Put the short durable repository rule in the automatic contract. Link to details instead of copying them.&#x27;],
    product: [&#x27;README.md or docs/PRODUCT.md&#x27;, &#x27;Own the stable user promise, product boundary, and route-specific privacy statement here.&#x27;],
    architecture: [&#x27;docs/ARCHITECTURE.md&#x27;, &#x27;Own stable components, data flow, boundaries, state, persistence, platform seams, and operations here.&#x27;],
    status: [&#x27;docs/CURRENT.md&#x27;, &#x27;Record verified present posture, active risk, immediate priority, evidence date, and unverified claims only.&#x27;],
    task: [&#x27;GitHub Issue&#x27;, &#x27;Give the unfinished outcome a problem statement, acceptance criteria, scope, non-goals, and links.&#x27;],
    plan: [&#x27;docs/plans/active/&#x27;, &#x27;Use a checked-in execution plan for substantial work with stages, decisions, verification, and handoff state.&#x27;],
    decision: [&#x27;docs/decisions/&#x27;, &#x27;Record a costly-to-reverse choice, options considered, rationale, and consequences.&#x27;],
    change: [&#x27;Commit and pull request&#x27;, &#x27;The diff is the exact record; the PR preserves scope, reasoning, evidence, and review.&#x27;],
    release: [&#x27;CHANGELOG.md and GitHub Release&#x27;, &#x27;Record a user-visible change only after the exact artifact ships.&#x27;],
    procedure: [&#x27;Runbook, script/test, or skill&#x27;, &#x27;Start as a runbook. Use a script/test when deterministic. Create a focused skill after repeated judgment-heavy success.&#x27;]
  };
  const route = document.getElementById(&#x27;mcg-route&#x27;);
  const routeAnswer = document.getElementById(&#x27;mcg-route-answer&#x27;);
  const renderRoute = () =&gt; {
    const selected = routes[route.value];
    routeAnswer.innerHTML = `&lt;strong&gt;${selected[0]}&lt;/strong&gt;&lt;span&gt;${selected[1]}&lt;/span&gt;`;
  };
  route.addEventListener(&#x27;change&#x27;, renderRoute);
  renderRoute();

  const sizes = {
    tiny: &#x27;&lt;strong&gt;Tiny fix:&lt;/strong&gt; clear outcome → inspect → edit → focused check → diff review. No plan document or status/log update unless canonical truth changes.&#x27;,
    normal: &#x27;&lt;strong&gt;Normal feature:&lt;/strong&gt; Issue → Plan mode → short-lived branch → focused regression → coherent implementation → review → draft PR → CI → merge.&#x27;,
    large: &#x27;&lt;strong&gt;Multi-day or risky:&lt;/strong&gt; Issue + checked-in active plan → decision points → vertical slices → branch/worktree → checkpoint commits → broader/native review → candidate evidence.&#x27;
  };
  const sizeInputs = [...root.querySelectorAll(&#x27;input[name=&quot;mcg-size&quot;]&#x27;)];
  const sizeAnswer = document.getElementById(&#x27;mcg-size-answer&#x27;);
  const renderSize = () =&gt; {
    const selected = sizeInputs.find((input) =&gt; input.checked);
    sizeAnswer.innerHTML = sizes[selected ? selected.value : &#x27;tiny&#x27;];
  };
  sizeInputs.forEach((input) =&gt; input.addEventListener(&#x27;change&#x27;, renderSize));
  renderSize();

  const checks = [...root.querySelectorAll(&#x27;#mcg-completion-list input[type=&quot;checkbox&quot;]&#x27;)];
  const completion = document.getElementById(&#x27;mcg-completion-progress&#x27;);
  const renderCompletion = () =&gt; {
    const done = checks.filter((input) =&gt; input.checked).length;
    completion.innerHTML = done === checks.length
      ? &#x27;&lt;strong&gt;7 of 7:&lt;/strong&gt; this task has the minimum closeout evidence. Merge and release gates may still remain.&#x27;
      : `&lt;strong&gt;${done} of ${checks.length}:&lt;/strong&gt; completion is not yet evidenced.`;
  };
  checks.forEach((input) =&gt; input.addEventListener(&#x27;change&#x27;, renderCompletion));
  renderCompletion();

  const copyStatus = document.getElementById(&#x27;mcg-copy-status&#x27;);
  const fallbackCopy = (text) =&gt; {
    const area = document.createElement(&#x27;textarea&#x27;);
    area.value = text;
    area.setAttribute(&#x27;readonly&#x27;, &#x27;&#x27;);
    area.style.position = &#x27;absolute&#x27;;
    area.style.left = &#x27;-9999px&#x27;;
    document.body.appendChild(area);
    area.select();
    const ok = document.execCommand(&#x27;copy&#x27;);
    area.remove();
    return ok;
  };
  root.querySelectorAll(&#x27;[data-copy]&#x27;).forEach((button) =&gt; {
    button.addEventListener(&#x27;click&#x27;, async () =&gt; {
      const source = document.getElementById(button.dataset.copy);
      const text = source ? source.innerText.trim() : &#x27;&#x27;;
      let copied = false;
      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch (_error) {
        copied = fallbackCopy(text);
      }
      copyStatus.textContent = copied ? &#x27;Copied.&#x27; : &#x27;Copy was blocked; select the text manually.&#x27;;
    });
  });

  const chapters = [...root.querySelectorAll(&#x27;.chapter&#x27;)];
  const currentChapter = document.getElementById(&#x27;mcg-current-chapter&#x27;);
  const progressText = document.getElementById(&#x27;mcg-progress-text&#x27;);
  const progressBar = document.getElementById(&#x27;mcg-progress-bar&#x27;);
  const updateReadingProgress = () =&gt; {
    const doc = document.documentElement;
    const denominator = Math.max(1, doc.scrollHeight - window.innerHeight);
    const percent = Math.max(0, Math.min(100, Math.round((window.scrollY / denominator) * 100)));
    progressBar.style.width = `${percent}%`;
    progressText.textContent = `${percent}% read`;

    let active = chapters[0];
    chapters.forEach((chapter) =&gt; {
      if (chapter.getBoundingClientRect().top &lt;= 160) active = chapter;
    });
    const number = active.querySelector(&#x27;.chapter-number&#x27;);
    const title = active.querySelector(&#x27;h2&#x27;);
    if (number &amp;&amp; title) currentChapter.textContent = `Chapter ${number.textContent.trim()} · ${title.textContent.trim()}`;
  };
  window.addEventListener(&#x27;scroll&#x27;, updateReadingProgress, { passive: true });
  window.addEventListener(&#x27;resize&#x27;, updateReadingProgress);
  updateReadingProgress();
})();
&lt;/script&gt;
&lt;/main&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });

  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
