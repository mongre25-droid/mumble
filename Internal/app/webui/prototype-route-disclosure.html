<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mumble route disclosure prototype</title>
  <style>
    :root{--bg:#070706;--panel:#14130f;--panel2:#1b1913;--line:#3d3217;--gold:#f2bd3d;--text:#f7f3ea;--muted:#aaa59a;--green:#72d4a3;--red:#f27878;--blue:#7fc5ff;--amber:#ffcb68}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -20%,#2d2410 0,#0c0b08 32%,var(--bg) 68%);color:var(--text);font:14px/1.45 Inter,Segoe UI,sans-serif;min-height:100vh}
    button{font:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:28px auto 130px}.glass{background:linear-gradient(145deg,rgba(30,28,22,.96),rgba(12,12,10,.98));border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .top{height:62px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:800}.logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ffd96e,#ad7616);color:#251a05;font-weight:900}
    .route{display:flex;align-items:center;gap:9px;border:1px solid var(--line);padding:8px 12px;border-radius:999px;background:#0f0e0b;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px currentColor}.route.cloud .dot{background:var(--blue)}.route.warning .dot{background:var(--amber)}.route.error .dot{background:var(--red)}
    .scenarios{display:flex;gap:8px;overflow:auto;margin-bottom:14px;padding:4px 0}.scenarios button{white-space:nowrap;border:1px solid #29271f;color:#77736a;background:#0e0e0c;border-radius:999px;padding:8px 11px;cursor:pointer;font-size:11px}.scenarios button.active{background:var(--gold);border-color:var(--gold);color:#211705}
    .view{min-height:620px}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:16px}.main,.side{border-radius:26px;padding:30px;min-height:610px}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800}h1{font-size:clamp(36px,5vw,64px);line-height:1.02;margin:15px 0}h2{font-size:26px;margin:12px 0}h3{font-size:15px;margin:0 0 18px}.muted{color:var(--muted)}.lead{font-size:17px;max-width:680px}.route-card{margin:28px 0;padding:22px;border:1px solid #4f411d;border-radius:20px;background:#100f0c;display:grid;grid-template-columns:auto 1fr;gap:15px}.route-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#2d2512;color:var(--gold);font-weight:900}.route-card.cloud .route-icon{background:#14283a;color:var(--blue)}.route-card.warning .route-icon{color:var(--amber)}.route-card.error .route-icon{color:var(--red)}.route-card b{font-size:18px}.route-card p{margin:4px 0 0;color:var(--muted)}
    .actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary{border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:#1f1605;border:1px solid var(--gold)}.secondary{background:#11100d;color:var(--text);border:1px solid #4b3e20}.facts{display:grid;gap:0}.fact{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #28251d;color:#77736a;font-size:12px}.fact b{color:var(--text);text-align:right}.notice{margin-top:22px;padding:15px;border-left:3px solid var(--gold);background:#17150f;color:var(--muted)}
    .consent{margin-top:22px;border:1px solid #4e4020;border-radius:20px;background:#0e0e0c;padding:24px}.consent h2{margin-top:0}.consent-list{display:grid;gap:10px;margin:18px 0}.consent-list div{display:flex;gap:10px;color:var(--muted)}.check{color:var(--gold);font-weight:900}.danger{border-color:#5d2d2d;background:#180e0e}.danger .eyebrow{color:var(--red)}
    .auto-banner{border:1px solid #5d2d2d;background:#190f0f;padding:14px 16px;border-radius:15px;margin:24px 0;color:#ffc4c4}.tiny{font-size:11px}.switcher{position:fixed;z-index:9;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:7px;background:#f5f0e6;color:#17140f;border-radius:999px;box-shadow:0 18px 50px #000}.switcher button{width:34px;height:34px;border:0;border-radius:50%;background:#17140f;color:white;cursor:pointer}.switcher strong{min-width:230px;text-align:center;font-size:12px}
    .label{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border:1px solid #43391f;border-radius:999px;color:var(--muted);font-size:11px}.label strong{color:var(--text)}
    @media(max-width:850px){.grid{grid-template-columns:1fr}.main,.side{min-height:auto}.shell{width:min(100% - 18px,1180px)}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top glass"><div class="brand"><span class="logo">M</span>Mumble <span class="label">PROTOTYPE ONLY</span></div><div class="route" id="top-route"><span class="dot"></span><span id="top-copy">On-device · Private</span></div></header>
    <nav class="scenarios" id="scenarios" aria-label="Prototype scenario"></nav>
    <main class="view" id="view"></main>
  </div>
  <div class="switcher"><button id="prev" aria-label="Previous variant">←</button><strong id="variant-label">A — Persistent route</strong><button id="next" aria-label="Next variant">→</button></div>
  <script>
    const variants={A:'Persistent route',B:'Consent checkpoint',C:'Automatic fallback'};
    const states=[
      {id:'local',label:'Local ready',title:'Ready for private dictation',sub:'Speech is processed on this PC. Audio and transcript are not sent to a speech provider.',route:'On-device · Private',tone:'local',action:'Start dictating'},
      {id:'download',label:'Model download',title:'Preparing local dictation',sub:'Mumble needs a verified speech model before local dictation can begin.',route:'On-device · Preparing',tone:'warning',action:'Download local model'},
      {id:'weak',label:'Weaker PC',title:'Choose the supported route',sub:'This PC is unlikely to run the full local model comfortably. Private local dictation is still available with a smaller model.',route:'On-device · Choice needed',tone:'warning',action:'Use Local Light'},
      {id:'offer',label:'Cloud offered',title:'Local dictation needs attention',sub:'The local model could not start. Mumble has stopped; it will not send audio anywhere unless you choose another route.',route:'Stopped · Nothing sent',tone:'error',action:'Repair local model'},
      {id:'consent',label:'Cloud consent',title:'Allow cloud dictation?',sub:'This is optional. Local dictation remains the default and Mumble will not switch routes silently.',route:'Cloud · Awaiting consent',tone:'cloud',action:'Allow cloud for this session'},
      {id:'cloud',label:'Cloud active',title:'Cloud dictation is ready',sub:'Audio will be sent to the selected speech provider while this route is active.',route:'Cloud · Audio leaves this PC',tone:'cloud',action:'Start cloud dictation'},
      {id:'failed',label:'Cloud failure',title:'Cloud dictation unavailable',sub:'No further audio will be sent. Your unfinished text remains on this PC.',route:'Stopped · Cloud unavailable',tone:'error',action:'Return to Local Light'},
      {id:'recovered',label:'Local recovered',title:'Private dictation restored',sub:'Mumble has returned to on-device processing after a successful local check.',route:'On-device · Private',tone:'local',action:'Start dictating'}
    ];
    let q=new URLSearchParams(location.search),variant=(q.get('variant')||'A').toUpperCase(),stage=q.get('stage')||'local';if(!variants[variant])variant='A';
    const current=()=>states.find(x=>x.id===stage)||states[0];
    function facts(s){return `<div class="facts"><div class="fact"><span>Speech processing</span><b>${s.tone==='cloud'?'Selected cloud provider':'This PC'}</b></div><div class="fact"><span>Audio leaves PC</span><b>${s.tone==='cloud'?'Yes, while active':'No'}</b></div><div class="fact"><span>Transcript stored</span><b>Private Deck on this PC</b></div><div class="fact"><span>Microphone</span><b>${['local','cloud','recovered'].includes(s.id)?'Ready, not recording':'Off'}</b></div></div>`}
    function card(s){let icon=s.tone==='cloud'?'C':s.tone==='error'?'!':'L';return `<div class="route-card ${s.tone}"><div class="route-icon">${icon}</div><div><b>${s.route}</b><p>${s.sub}</p></div></div>`}
    function choices(s){if(s.id==='weak')return `<div class="actions"><button class="primary">Use Local Light</button><button class="secondary">Compare optional cloud</button></div><p class="tiny muted">Local Light prioritizes privacy and broad hardware support, with lower accuracy than the full local tier.</p>`;if(s.id==='offer')return `<div class="actions"><button class="primary">Repair local model</button><button class="secondary">Use Local Light</button><button class="secondary">Review optional cloud</button></div>`;return `<div class="actions"><button class="primary">${s.action}</button><button class="secondary">View route details</button></div>`}
    function consent(s){return `<section class="consent"><div class="eyebrow">Explicit permission required</div><h2>${s.title}</h2><p class="muted">${s.sub}</p><div class="consent-list"><div><span class="check">✓</span><span><b>Sent:</b>&nbsp;microphone audio needed for this dictation</span></div><div><span class="check">✓</span><span><b>Provider:</b>&nbsp;the provider you configure and name here</span></div><div><span class="check">✓</span><span><b>Credentials and charges:</b>&nbsp;shown before enabling; never assumed</span></div><div><span class="check">✓</span><span><b>Control:</b>&nbsp;session-only permission by default, with a visible stop control</span></div></div><div class="actions"><button class="primary">Allow cloud for this session</button><button class="secondary">Keep everything local</button></div></section>`}
    function render(){const s=current();document.querySelector('#scenarios').innerHTML=states.map(x=>`<button data-stage="${x.id}" class="${x.id===s.id?'active':''}">${x.label}</button>`).join('');
      const autoCloud=variant==='C'&&['offer','consent','cloud'].includes(s.id);const top=document.querySelector('#top-route');top.className='route '+(autoCloud||s.tone==='cloud'?'cloud':s.tone==='warning'?'warning':s.tone==='error'?'error':'');document.querySelector('#top-copy').textContent=autoCloud?'Cloud · Automatic fallback':s.route;document.querySelector('#variant-label').textContent=variant+' — '+variants[variant];
      if(variant==='A')document.querySelector('#view').innerHTML=`<section class="grid"><article class="main glass"><div class="eyebrow">Current processing route</div><h1>${s.title}</h1><p class="lead muted">${s.sub}</p>${card(s)}${choices(s)}<div class="notice">Mumble never changes from local to cloud without stopping and asking first.</div></article><aside class="side glass"><h3>What happens to your speech</h3>${facts(s)}<p class="tiny muted" style="margin-top:20px">Route status remains visible before, during, and after dictation.</p></aside></section>`;
      if(variant==='B')document.querySelector('#view').innerHTML=`<section class="grid"><article class="main glass"><span class="label"><strong>${s.route}</strong></span>${s.id==='consent'?consent(s):`<div class="eyebrow" style="margin-top:35px">A route change needs your choice</div><h1>${s.title}</h1><p class="lead muted">${s.sub}</p>${card(s)}${choices(s)}`}</article><aside class="side glass"><h3>Before you decide</h3>${facts(s)}<div class="notice">Cloud remains off unless this screen names what is sent, where it goes, and who may charge or retain it.</div></aside></section>`;
      if(variant==='C')document.querySelector('#view').innerHTML=`<section class="grid"><article class="main glass"><div class="eyebrow">Seamless mode</div><h1>${autoCloud?'Cloud fallback started':s.title}</h1><p class="lead muted">${autoCloud?'The local route failed, so this alternative began sending audio to the configured provider.':s.sub}</p>${autoCloud?'<div class="auto-banner"><b>Route changed automatically</b><br>Cloud processing began after local processing failed.</div>':''}${autoCloud?card({...s,tone:'cloud',route:'Cloud · Audio leaves this PC'}):card(s)}${choices(s)}</article><aside class="side glass danger"><div class="eyebrow">Privacy risk</div><h2>Fast, but not acceptable</h2><p class="muted">A notification after switching is not consent. The user may miss it, credentials may incur charges, and audio may leave the PC unexpectedly.</p>${facts(autoCloud?{...s,tone:'cloud'}:s)}</aside></section>`;
      document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;setUrl();render()});}
    function setUrl(){let u=new URLSearchParams(location.search);u.set('variant',variant);u.set('stage',stage);history.replaceState({},'',location.pathname+'?'+u)}function cycle(d){const k=Object.keys(variants);variant=k[(k.indexOf(variant)+d+k.length)%k.length];setUrl();render()}
    document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
  </script>
</body>
</html>
