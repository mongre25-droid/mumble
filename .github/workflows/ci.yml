name: Mumble CI

on:
  push:
  pull_request:

jobs:
  windows-offline:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Internal/app
    env:
      PYTHONUTF8: "1"
      MUMBLE_OFFLINE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated test data
        shell: pwsh
        run: |
          "MUMBLE_TEST_DATA_DIR=$env:RUNNER_TEMP\mumble-ci-data" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Internal/app/requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m compileall -q -x "(^|[\\/])(.venv|__pycache__)([\\/]|$)" .
      - run: python -m flake8 . --select=E9,F63,F7,F82 --exclude=.venv,Ports
      - run: python -m bandit -r . -x .venv,Ports,__pycache__,test_*.py -lll -ii
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
      - run: python run_tests.py --json test-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-offline-test-results
          path: Internal/app/test-results.json

  macos-offline:
    # macos-15 is the current arm64 hosted image; macos-14 entered
    # deprecation in July 2026 and would make this gate short-lived.
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Internal/app/Ports/macOS/app
    env:
      PYTHONUTF8: "1"
      MUMBLE_OFFLINE_TESTS: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated test data
        run: echo "MUMBLE_TEST_DATA_DIR=$RUNNER_TEMP/mumble-ci-data" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Internal/app/Ports/macOS/app/requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate and build the macOS release archive
        run: |
          bash -n "../Install Mumble.command" "../Uninstall Mumble.command" \
            "../Launch Mumble.command" ../build_mac_release.sh
          cd ..
          bash build_mac_release.sh
          shasum -a 256 -c Mumble-v*-macos.zip.sha256
      - run: python -m compileall -q -x "(^|/)(.venv|__pycache__)(/|$)" .
      - run: python -m flake8 . --select=E9,F63,F7,F82 --exclude=.venv,__pycache__
      - run: python -m bandit -r . -x .venv,__pycache__,test_*.py -lll -ii
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
      - run: python run_tests.py --all --json test-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-offline-test-results
          path: |
            Internal/app/Ports/macOS/app/test-results.json
            Internal/app/Ports/macOS/Mumble-v*-macos.zip
            Internal/app/Ports/macOS/Mumble-v*-macos.zip.sha256

  linux-offline-and-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Internal/app/Ports/Linux/app
    env:
      PYTHONUTF8: "1"
      MUMBLE_OFFLINE_TESTS: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated test data
        run: echo "MUMBLE_TEST_DATA_DIR=$RUNNER_TEMP/mumble-ci-data" >> "$GITHUB_ENV"
      - name: Install Linux system dependencies and packaging validators
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential desktop-file-utils gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 libportaudio2 python3-dev python3-gi \
            python3-gi-cairo python3-pip python3-venv shellcheck xdg-utils xvfb
      - name: Create system-site-packages test environment
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          python3 -m venv --system-site-packages "$RUNNER_TEMP/mumble-linux-test-venv"
          "$RUNNER_TEMP/mumble-linux-test-venv/bin/python" -m pip install \
            --disable-pip-version-check -r requirements-dev.txt
          echo "$RUNNER_TEMP/mumble-linux-test-venv/bin" >> "$GITHUB_PATH"
          test ! -e .venv
      - name: Validate shell packaging scripts
        run: |
          bash -n ../install.sh ../uninstall.sh
          shellcheck --severity=warning ../install.sh ../uninstall.sh
      - name: Resolve CPython 3.14 Linux STT/audio wheels
        run: |
          python -m pip install --dry-run --ignore-installed --only-binary=:all: \
            --platform manylinux_2_28_x86_64 \
            --platform manylinux_2_27_x86_64 \
            --platform manylinux2014_x86_64 \
            --platform manylinux_2_17_x86_64 \
            --implementation cp --python-version 3.14 --abi cp314 \
            --target "$RUNNER_TEMP/py314-resolution" \
            numpy==2.5.1 scipy==1.18.0 soundfile==0.14.0 faster-whisper==1.2.1
      - name: Build and verify deterministic Linux release archives
        run: |
          python ../build_release.py --output-dir "$RUNNER_TEMP/linux-release"
          python ../test_build_release.py
      - run: python -m compileall -q -x "(^|/)(.venv|__pycache__)(/|$)" .
      - run: python -m flake8 . --select=E9,F63,F7,F82 --exclude=.venv,__pycache__
      - run: python -m bandit -r . -x .venv,__pycache__,test_*.py -lll -ii
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
      - run: xvfb-run -a python run_tests.py --all --json test-results.json
      - name: Exercise built-archive install and uninstall lifecycle
        run: |
          mkdir -p "$RUNNER_TEMP/mumble-release-extract"
          archive="$(find "$RUNNER_TEMP/linux-release" -maxdepth 1 \
            -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP/mumble-release-extract"
          RELEASE_ROOT="$(find "$RUNNER_TEMP/mumble-release-extract" \
            -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$RELEASE_ROOT"
          export HOME="$RUNNER_TEMP/mumble-linux-home"
          export XDG_DATA_HOME="relative-data-must-be-ignored"
          export XDG_CONFIG_HOME="relative-config-must-be-ignored"
          export MUMBLE_INSTALL_SYSTEM_PACKAGES=0
          export MUMBLE_SKIP_MODEL_DOWNLOAD=1
          mkdir -p "$HOME"
          bash "$RELEASE_ROOT/install.sh"
          desktop-file-validate \
            "$HOME/.local/share/applications/mumble-voice-to-text.desktop" \
            "$HOME/.local/share/applications/mumble-voice-to-text-uninstall.desktop"
          test -x "$RELEASE_ROOT/mumble"
          xvfb-run -a "$RELEASE_ROOT/app/.venv/bin/python" -c \
            'import branding, mumble_linux, webui_shell; print(branding.APP_NAME)'
          test -f "$HOME/.config/autostart/mumble-voice-to-text.desktop"
          test -f "$HOME/.local/share/icons/hicolor/256x256/apps/mumble-voice-to-text.png"
          test ! -e "$HOME/.local/share/applications/mumble.desktop"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' \
            'Name=Mumble VoIP' 'Exec=mumble' \
            > "$HOME/.config/autostart/mumble.desktop"
          bash "$RELEASE_ROOT/uninstall.sh" --purge-data
          test ! -e "$RELEASE_ROOT/mumble"
          test ! -e "$HOME/.config/autostart/mumble-voice-to-text.desktop"
          test -f "$HOME/.config/autostart/mumble.desktop"
          test ! -e "$HOME/.local/share/applications/mumble-voice-to-text.desktop"
          test ! -e "$HOME/.local/share/Mumble"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-offline-and-release-results
          path: |
            Internal/app/Ports/Linux/app/test-results.json
            ${{ runner.temp }}/linux-release/*

  website:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Development Files/Marketing/Website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Development Files/Marketing/Website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx astro check
