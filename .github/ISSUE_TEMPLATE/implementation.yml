name: Implementation work
description: Define one bounded change with proof of completion and explicit blockers.
title: "work: "
labels: ["kind: implementation"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended result
      description: Explain what is wrong and what the user or developer will observe when it is fixed.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and boundaries
      description: Name the relevant areas, exclusions, planning map, and decision tickets.
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Blocked by / blocks
      description: Use GitHub issue numbers and add native issue relationships when available.
      placeholder: "Blocked by #123. Blocks #124."
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: List observable checks, focused tests, review, documentation, and any physical or release evidence.
      placeholder: |
        - [ ] A focused test covers the changed behaviour.
        - [ ] The relevant isolated checks pass.
        - [ ] Durable records reflect the new reality.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks, assumptions, and owner decisions
      description: Record anything unproven or requiring credentials, spending, signing, physical hardware, or release authority.
